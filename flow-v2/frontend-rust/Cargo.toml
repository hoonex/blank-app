[package]
name = "flow-school-web"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.7", features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage", "Document", "HtmlElement", "Element", "DomRect", "EventTarget", "Touch", "TouchEvent", "TouchList"] }
js-sys = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
urlencoding = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
