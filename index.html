<!doctype html><html lang="ko" data-theme="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f8"><meta name="description" content="학교를 고르면 시간표, 급식, 학사일정을 바로 보여주는 학생용 학교생활 대시보드."><title>Flow School</title><link rel="manifest" href="./manifest.webmanifest"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./school.css"></head><body><div class="loading-line" id="loadingLine"></div><div class="app"><header class="topbar glass"><div class="brand"><span class="brand-mark"></span><span class="brand-text">Flow School</span></div><div class="top-actions"><button class="school-btn hidden" id="schoolBtn" type="button"><span id="schoolNameTop">학교</span><span class="school-class" id="schoolClassTop"></span></button><button class="icon-btn" id="themeBtn" type="button">A</button></div></header><main><section class="landing" id="landing"><div class="landing-inner"><div class="landing-kicker">FLOW SCHOOL</div><h1>학교생활,<br>열자마자 바로.</h1><p>학교를 한 번만 선택하세요. 다음부터는 오늘 시간표, 급식, 학사일정을 바로 보여줍니다.</p><div class="search-wrap"><div class="search-box"><input id="schoolSearch" type="search" autocomplete="off" placeholder="학교 이름 검색 · 예: 정동고"><button id="schoolSearchBtn" type="button">찾기</button></div><div class="search-results hidden" id="schoolResults"></div></div><div class="landing-features"><span><i></i>설정 자동 기억</span><span><i></i>NEIS 데이터</span><span><i></i>선택과목 수정</span></div></div></section><section class="dashboard hidden" id="dashboard"><div class="error-box hidden" id="errorBox"></div><section class="hero"><div><div class="hero-kicker" id="heroKicker">TODAY</div><h1 id="heroDate">오늘</h1><div class="hero-sub" id="heroSub"></div></div><div class="date-nav"><button id="prevDay" type="button">‹</button><div class="date-title" id="dateTitle"></div><button id="nextDay" type="button">›</button><button class="ghost-btn" id="todayBtn" type="button">오늘</button></div></section><section class="quickbar"><div class="quick"><span>수업</span><strong id="quickLessons">—</strong></div><div class="quick"><span>급식</span><strong id="quickMeal">—</strong></div><div class="quick"><span>다음 일정</span><strong id="quickEvent">—</strong></div></section><section id="todaySection"><div class="workspace"><article class="card"><div class="card-head"><div><div class="card-title">시간표</div><div class="card-caption">요일을 눌러 날짜를 바꿉니다.</div></div><button class="soft-btn" id="editSubjectsBtn" type="button">과목 수정</button></div><div class="day-strip" id="dayStrip"></div><div class="timetable" id="timetable"></div></article><div><article class="card"><div class="card-head"><div><div class="card-title">급식</div><div class="card-caption">메뉴를 누르면 음식 사진도 바로 볼 수 있습니다.</div></div></div><div class="meal-tabs" id="mealTabs"></div><div class="meal-list" id="mealList"></div><div class="meal-cal" id="mealCal"></div></article><article class="card schedule-card"><div class="card-head"><div><div class="card-title">다가오는 일정</div></div></div><div class="event-list" id="eventList"></div></article></div></div></section><section class="hidden" id="weekSection"><article class="card week-card"><div class="card-head"><div><div class="card-title">이번 주</div></div><div class="date-nav"><button id="prevWeek" type="button">‹</button><button id="nextWeek" type="button">›</button></div></div><div class="week-table-wrap"><div class="week-table" id="weekTable"></div></div></article></section><section class="hidden" id="scheduleSection"><article class="card week-card"><div class="card-head"><div><div class="card-title">학사일정</div></div></div><div class="schedule-grid" id="scheduleGrid"></div></article></section><p class="source-note">교육부·17개 시도교육청 NEIS 교육정보 개방 데이터를 사용합니다.</p></section></main></div><nav class="bottom-nav hidden" id="bottomNav"><button class="tab-btn active" type="button" data-view="today">오늘</button><button class="tab-btn" type="button" data-view="week">주간</button><button class="tab-btn" type="button" data-view="schedule">일정</button></nav><dialog id="setupDialog"><div class="sheet"><button class="close-btn dialog-close" type="button">×</button><h2>내 반 설정</h2><p>이 설정은 현재 기기에만 저장됩니다.</p><div class="setup-school" id="setupSchoolName"></div><div class="field-label">학년</div><div class="grade-row" id="gradeRow"></div><div class="field-label">반</div><div class="class-control"><button id="classMinus" type="button">−</button><input id="classInput" type="number" min="1" max="99" value="1"><button id="classPlus" type="button">+</button></div><button class="primary-btn" id="setupSave" type="button">이대로 시작</button></div></dialog><dialog id="switchDialog"><div class="sheet"><button class="close-btn dialog-close" type="button">×</button><h2>학교 바꾸기</h2><p id="currentSchoolMeta"></p><div class="search-wrap modal-search"><div class="search-box"><input id="switchSearch" type="search" autocomplete="off" placeholder="다른 학교 검색"></div><div class="search-results hidden" id="switchResults"></div></div><button class="soft-btn" id="changeSchoolBtn" type="button">현재 설정 지우기</button></div></dialog><div class="toast" id="toast"></div><script type="module" src="./school.js"></script><script type="module" src="./school-extras.js"></script></body></html>
