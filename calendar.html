<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Flow Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="app-shell">
    <aside class="sidebar glass-panel">
      <div class="brand-row"><div class="brand-mark"></div><div><div class="brand-title">Flow</div><div class="brand-subtitle">Calendar</div></div></div>
      <button class="primary-btn" id="openCreateDesktop">새 일정</button>
      <nav class="nav-list" aria-label="주요 메뉴">
        <button class="nav-item" type="button" onclick="location.href='./quest.html'">Flow Quest 플레이</button>
        <button class="nav-item active" data-view="calendar">캘린더</button>
        <button class="nav-item" data-view="today">오늘</button>
        <button class="nav-item" data-view="upcoming">다가오는 일정</button>
        <button class="nav-item" type="button" onclick="location.href='./focus.html'">시험 계획 자동 생성</button>
      </nav>
      <div class="sidebar-section"><div class="section-label">캘린더</div><label class="calendar-filter"><input type="checkbox" data-category="school" checked><span class="dot school"></span>학교</label><label class="calendar-filter"><input type="checkbox" data-category="personal" checked><span class="dot personal"></span>개인</label><label class="calendar-filter"><input type="checkbox" data-category="work" checked><span class="dot work"></span>프로젝트</label></div>
      <div class="sidebar-footer"><div class="mini-card"><div class="mini-card-label">이번 달</div><div class="mini-card-value" id="monthlyCount">0 일정</div></div></div>
    </aside>
    <main class="main-area">
      <header class="topbar glass-panel">
        <div class="topbar-left"><button class="icon-btn mobile-only" id="openCreateMobileTop" aria-label="일정 추가">＋</button><button class="icon-btn mobile-only" style="font-size:.68rem;width:48px" type="button" onclick="location.href='./quest.html'" aria-label="Flow Quest 플레이">게임</button><button class="icon-btn mobile-only" style="font-size:.68rem;width:48px" type="button" onclick="location.href='./focus.html'" aria-label="시험 계획 자동 생성">계획</button><div><div class="eyebrow" id="todayLabel"></div><h1 id="monthTitle"></h1></div></div>
        <div class="topbar-actions"><div class="segmented" role="group" aria-label="캘린더 보기"><button data-calendar-mode="month" class="active">월</button><button data-calendar-mode="week">주</button></div><button class="ghost-btn" id="goToday">오늘</button><button class="icon-btn" id="prevPeriod" aria-label="이전">‹</button><button class="icon-btn" id="nextPeriod" aria-label="다음">›</button></div>
      </header>
      <section class="content-grid"><div class="calendar-card glass-panel"><div id="calendarContainer"></div></div><aside class="agenda-panel glass-panel"><div class="agenda-head"><div><div class="section-label">선택한 날짜</div><h2 id="selectedDateTitle"></h2></div><button class="icon-btn" id="quickAdd" aria-label="선택한 날짜에 일정 추가">＋</button></div><div id="agendaList" class="agenda-list"></div></aside></section>
    </main>
  </div>
  <button class="floating-add" id="floatingAdd" aria-label="일정 추가">＋</button>
  <dialog id="eventDialog" class="event-dialog"><form id="eventForm" method="dialog" class="dialog-card glass-panel"><div class="dialog-header"><div><div class="section-label">일정 편집</div><h2 id="dialogTitle">새 일정</h2></div><button type="button" class="icon-btn" id="closeDialog" aria-label="닫기">×</button></div><input type="hidden" id="eventId" /><label class="field"><span>제목</span><input id="eventTitle" maxlength="60" required placeholder="예: 수학 수행평가" /></label><div class="field-row"><label class="field"><span>날짜</span><input id="eventDate" type="date" required /></label><label class="field"><span>시간</span><input id="eventTime" type="time" /></label></div><label class="field"><span>분류</span><select id="eventCategory"><option value="school">학교</option><option value="personal">개인</option><option value="work">프로젝트</option></select></label><label class="field"><span>메모</span><textarea id="eventNotes" rows="4" maxlength="240" placeholder="필요한 내용을 간단히 적어두세요."></textarea></label><div class="dialog-actions"><button type="button" class="danger-btn hidden" id="deleteEvent">삭제</button><div class="action-spacer"></div><button type="button" class="ghost-btn" id="cancelDialog">취소</button><button type="submit" class="primary-btn compact">저장</button></div></form></dialog>
  <template id="agendaEmptyTemplate"><div class="empty-state"><div class="empty-orb"></div><strong>일정이 없습니다</strong><span>이 날짜에 새 일정을 추가해보세요.</span></div></template>
  <script src="./app.js"></script>
</body>
</html>
