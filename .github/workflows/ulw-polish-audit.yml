name: ULW polish audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  polish-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate sources
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s .github/pull_request_template.md
          node --check university/ui-unify.js
          node --check university/dashboard-editor-feedback.js
          node --check university/campus-geolocation-bridge.js
          node --input-type=module --check < university/campus-interactive.js
          node --check scripts/ulw-polish-audit.mjs
          grep -q 'Never edit `main` directly' AGENTS.md
          grep -q 'dashboard-editor-feedback.js' university/campus-interactive.js
          grep -q 'ui-unify.js' university/campus-interactive.js
          grep -q 'campus-geolocation-bridge.js' university/campus-interactive.js
          grep -q 'flow-campus-current-location' university/campus-interactive.css
          grep -q 'dashboard-editor-feedback.js' sw.js
          grep -q 'ui-unify.js' sw.js
          grep -q 'campus-geolocation-bridge.js' sw.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-ulw-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-ulw-server.log
          exit 1
      - name: Run browser audit
        run: node scripts/ulw-polish-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ulw-polish-audit
          path: ulw-audit/
          retention-days: 5
