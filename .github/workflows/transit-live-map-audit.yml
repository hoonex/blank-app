name: Transit live map audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'school-transit-map.js'
      - 'school-transit-map.css'
      - 'school-transit-rail-map.css'
      - 'school-transit.js'
      - 'school-transit.css'
      - 'supabase/functions/transit-map/**'
      - 'tests/transit-live-map-audit.mjs'
      - 'tests/transit-official-road-visual-audit.mjs'
      - '.github/workflows/transit-live-map-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transit-live-map-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate map sources
        run: |
          set -euo pipefail
          node --check school-transit.js
          node --check school-transit-map.js
          node --check tests/transit-live-map-audit.mjs
          node --check tests/transit-official-road-visual-audit.mjs
          test -s school-transit.css
          test -s school-transit-map.css
          test -s school-transit-rail-map.css
          test -s supabase/functions/transit-map/official-route-geometry.ts
          test -s supabase/functions/transit-map/daegu-official-network.ts
          grep -q "DESTINATION_KEY='flow-school-transit-destination-v1'" school-transit.js
          grep -q "official-road-geometry" school-transit-map.js
          grep -q "공식 버스 노선 공간정보" school-transit-map.js
          ! grep -q "smoothStopPath" school-transit-map.js
          ! grep -q "smooth-stop-guide" school-transit-map.js
          grep -q "daegu-official-bus-link-snapshot" supabase/functions/transit-map/index.ts
          grep -q 'OFFICIAL_ROUTE_SNAPSHOT="2025-09-03"' supabase/functions/transit-map/daegu-official-network.ts
          grep -q "VEHICLE_REFRESH_MS=15000" school-transit-map.js
          grep -q "railMapCapable" school-transit-map.js
          grep -q "visibilitychange" school-transit-map.js
          grep -q "실시간 열차 위치" school-transit-map.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-transit-live-map.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-transit-live-map.log
          exit 1
      - name: Verify destination editing, rail sheets, and live bus refresh
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/transit-live-map-audit.mjs
      - name: Capture official bus road geometry at six viewports
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/transit-official-road-visual-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transit-live-map-audit
          path: |
            transit-live-map-audit/
            transit-official-road-visual-audit/
          retention-days: 7
