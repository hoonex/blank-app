name: Browser UX audit

on:
  push:
    branches: [perf/browser-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify official school media parser
        run: |
          node --check supabase/functions/_shared/school-media-parser.js
          node --check tests/school-media-parser-audit.mjs
          node tests/school-media-parser-audit.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 > /tmp/flow-server.log 2>&1 &
          echo $! > /tmp/flow-server.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep .5
          done
          cat /tmp/flow-server.log
          exit 1

      - name: Run browser interaction + performance audit
        env:
          FLOW_TEST_URL: http://127.0.0.1:4173/
        run: node tests/browser-audit.mjs

      - name: Verify Light theme on dark mobile OS
        if: success()
        env:
          FLOW_TEST_URL: http://127.0.0.1:4173/
        run: node tests/mobile-light-audit.mjs

      - name: Verify landing shell composition
        if: success()
        env:
          FLOW_TEST_URL: http://127.0.0.1:4173/
        run: |
          node --check tests/contextual-shell-audit.mjs
          node tests/contextual-shell-audit.mjs

      - name: Verify mobile school info and meal time
        if: success()
        env:
          FLOW_TEST_URL: http://127.0.0.1:4173/
        run: node tests/mobile-school-info-audit.mjs

      - name: Verify school logo fallback request budget
        if: success()
        env:
          FLOW_TEST_URL: http://127.0.0.1:4173/
        run: node tests/school-logo-fallback-audit.mjs

      - name: Verify Kakao school map behavior with fixture
        if: success()
        env:
          FLOW_TEST_URL: http://127.0.0.1:4173/
        run: node tests/kakao-map-audit.mjs

      - name: Verify School calendar week geometry
        if: success()
        run: |
          node --check scripts/school-calendar-geometry-audit.mjs
          node scripts/school-calendar-geometry-audit.mjs

      - name: Capture current-date mobile and wide-touch layouts
        if: success()
        env:
          FLOW_TEST_URL: http://127.0.0.1:4173/
        run: node tests/current-state-shots.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit
          path: |
            browser-audit-artifacts
            school-calendar-audit
            contextual-shell-audit
          retention-days: 7
