name: Admin audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate admin sources
        run: |
          set -euo pipefail
          node --check admin/admin.js
          node --check tests/admin-audit.mjs
          grep -q "flow_admins" supabase/migrations/20260820_flow_admin_observability.sql
          grep -q "flow_school_events" supabase/migrations/20260821_flow_admin_activity_health_v2.sql
          grep -q "probe_kind" supabase/migrations/20260821_flow_admin_activity_health_v2.sql
          grep -q 'kind: "reachability"' supabase/functions/flow-admin/index.ts
          test "$(grep -c 'service: ' supabase/functions/flow-admin/index.ts)" -ge 10
          grep -q "authentication required" supabase/functions/flow-admin/index.ts
          grep -q "url.pathname==='/admin'" sw.js
          ! grep -R -E 'sb_secret_[A-Za-z0-9_-]{10,}' admin supabase ADMIN.md
      - name: Verify deployed admin auth boundary
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/flow-admin-public.json -w '%{http_code}' 'https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/flow-admin?action=overview&hours=24')"
          test "$code" = 401
          grep -q 'authentication required' /tmp/flow-admin-public.json
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/flow-admin-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/admin/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-admin-server.log
          exit 1
      - name: Run admin browser audit
        run: node tests/admin-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-audit
          path: admin-audit-artifacts/
          if-no-files-found: warn
          retention-days: 5
