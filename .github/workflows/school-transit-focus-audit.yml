name: School Transit focus audit

on:
  pull_request:
    paths:
      - 'school-metrics.js'
      - 'school-transit-focus.js'
      - 'school-transit-focus.css'
      - 'school-transit.js'
      - 'school-transit.css'
      - 'school-transit-map.js'
      - 'school-transit-map.css'
      - 'tests/school-transit-focus-audit.mjs'
      - 'sw.js'
      - '.github/workflows/school-transit-focus-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  school-transit-focus-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate focused Transit sources
        run: |
          set -euo pipefail
          node --check school-transit-focus.js
          node --check tests/school-transit-focus-audit.mjs
          test -s school-transit-focus.css
          grep -q "school-transit-focus.js" school-metrics.js
          grep -q "school-transit-focus.js" sw.js
          grep -q "school-transit-focus.css" sw.js
          grep -q "flow-school-shell-v15" sw.js
          test ! -e school-transit-today.js
          test ! -e school-transit-today.css
          test ! -e tests/school-transit-today-audit.mjs
          test ! -e .github/workflows/school-today-transit-audit.yml
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-school-transit-focus.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-school-transit-focus.log
          exit 1
      - name: Verify focused Transit across six viewports
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-transit-focus-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-transit-focus-audit
          path: school-transit-focus-audit/
          retention-days: 7
