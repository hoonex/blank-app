name: Cloudflare clean-route refresh audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  clean-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare route worker
        run: |
          node --check cloudflare-worker.mjs
          node --check tests/cloudflare-clean-routes-audit.mjs
          python -m json.tool wrangler.jsonc >/dev/null
          node tests/cloudflare-clean-routes-audit.mjs
          grep -q '"name": "blank-app"' wrangler.jsonc
          grep -q '"binding": "ASSETS"' wrangler.jsonc
          grep -q 'cloudflare-worker.mjs' .assetsignore
          grep -q 'installUniversityFetchRetry' university/net-bootstrap.js

      - name: Validate Wrangler deployment bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/flow-wrangler-dry

      - name: Verify deployed clean routes survive refresh
        id: live_routes
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base='https://blank-app.agfvrd.workers.dev'
          routes=(
            '/home|Flow School'
            '/week|Flow School'
            '/schedule|Flow School'
            '/transit|Flow School'
            '/school|Flow School'
            '/university/timetable|Flow University'
            '/university/campus|Flow University'
            '/university/school|Flow University'
          )

          for attempt in $(seq 1 20); do
            ok=1
            echo "Cloudflare deployment probe attempt $attempt/20"
            for item in "${routes[@]}"; do
              route="${item%%|*}"
              marker="${item#*|}"
              body="/tmp/flow-route-$(echo "$route" | tr '/?' '__').html"
              code=$(curl --silent --show-error --location \
                --header 'cache-control: no-cache' \
                --connect-timeout 10 --max-time 20 \
                --output "$body" --write-out '%{http_code}' \
                "$base$route?flow_deploy=$GITHUB_SHA" || true)
              if [[ "$code" != '200' ]] || ! grep -q "$marker" "$body" 2>/dev/null; then
                echo "WAIT $route -> HTTP $code / expected $marker"
                ok=0
                break
              fi
              echo "OK $route -> 200 $marker"
            done

            if [[ "$ok" == '1' ]]; then
              deployed='/tmp/flow-net-bootstrap.js'
              code=$(curl --silent --show-error --location \
                --header 'cache-control: no-cache' \
                --connect-timeout 10 --max-time 20 \
                --output "$deployed" --write-out '%{http_code}' \
                "$base/university/net-bootstrap.js?flow_deploy=$GITHUB_SHA" || true)
              if [[ "$code" != '200' ]] || ! cmp -s university/net-bootstrap.js "$deployed"; then
                echo "WAIT /university/net-bootstrap.js -> HTTP $code / deployed bytes do not match main"
                ok=0
              else
                echo 'OK /university/net-bootstrap.js -> 200 exact repository bytes'
              fi
            fi

            if [[ "$ok" == '1' ]]; then
              echo 'Cloudflare clean-route and critical-asset health: GREEN'
              exit 0
            fi
            sleep 15
          done

          echo 'Cloudflare deployment health did not converge after 5 minutes.' >&2
          exit 1

      - name: Publish Cloudflare live-route status
        if: github.event_name == 'push' && always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_OUTCOME: ${{ steps.live_routes.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          state='success'
          description='Clean routes and critical University asset match production'
          if [[ "$LIVE_OUTCOME" != 'success' ]]; then
            state='failure'
            description='Cloudflare route or critical-asset probe failed'
          fi
          payload=$(python - "$state" "$description" <<'PY'
          import json,sys
          print(json.dumps({
            'state':sys.argv[1],
            'context':'Cloudflare clean routes',
            'description':sys.argv[2],
          }))
          PY
          )
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
          echo "Published Cloudflare clean routes status: $state"

      - name: Enforce Cloudflare live-route health
        if: github.event_name == 'push' && steps.live_routes.outcome != 'success'
        run: exit 1