name: Transit mixed-mode audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transit-mixed-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate mixed Transit sources
        run: |
          set -euo pipefail
          node --check tests/transit-mixed-ui-audit.mjs
          node scripts/edge-secret-audit.mjs
          test -s supabase/functions/transit-mixed/index.ts
          grep -q 'MIXED_URL' supabase/functions/transit-data/index.ts
          grep -q 'protected-orchestrator' supabase/functions/transit-data/index.ts
          grep -q 'bus-subway-bus' supabase/functions/transit-data/index.ts
          grep -q 'service-role-jwt-only' supabase/functions/transit-mixed/index.ts
          grep -q 'bus-subway-bus' supabase/functions/transit-mixed/index.ts
          grep -q 'bus-subway-walk' supabase/functions/transit-mixed/index.ts
          grep -q 'walk-subway-bus' supabase/functions/transit-mixed/index.ts
          grep -q 'railRealtime: false' supabase/functions/transit-mixed/index.ts
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' supabase/functions/transit-mixed/index.ts
          grep -q 'KAKAO_REST_KEY' supabase/functions/transit-mixed/index.ts
          ! grep -q 'transit-mixed' school-transit.js
      - name: Verify deployed gate advertises protected mixed routing
        shell: bash
        run: |
          set -euo pipefail
          base='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/transit-data'
          curl -fsSL --connect-timeout 10 --max-time 30 "$base?action=health" > /tmp/transit-health.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/transit-health.json','utf8'));
          if(!data?.ok) throw new Error(`Transit gate health failed: ${JSON.stringify(data)}`);
          if(data?.mixedRouting!=='protected-orchestrator') throw new Error(`Protected mixed orchestrator is not active: ${JSON.stringify(data)}`);
          for(const mode of ['bus-subway-bus','bus-subway-walk','walk-subway-bus']) if(!data?.routeModes?.includes(mode)) throw new Error(`Missing mixed route mode ${mode}`);
          if(data?.mixedAccess!=='service-role-jwt-only'||data?.railRealtime!==false) throw new Error(`Mixed routing safety contract failed: ${JSON.stringify(data)}`);
          console.log('Transit mixed-mode gate contract is active');
          NODE
      - name: Probe live Daegu route through mixed-aware gate
        shell: bash
        run: |
          set -euo pipefail
          base='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/transit-data'
          status=$(curl -sSL -o /tmp/transit-mixed-route.json -w '%{http_code}' --get --connect-timeout 10 --max-time 140 \
            --data-urlencode 'action=route' \
            --data-urlencode 'sx=128.6960' \
            --data-urlencode 'sy=35.8760' \
            --data-urlencode 'destination=대구광역시 북구 대학로 80' \
            "$base")
          if [ "$status" != "200" ]; then
            echo "Mixed-aware Transit route HTTP $status"
            cat /tmp/transit-mixed-route.json
            echo
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/transit-mixed-route.json','utf8'));
          const routes=Array.isArray(data?.routes)?data.routes:[];
          if(routes.length<1||routes.length>5) throw new Error(`Expected 1-5 routes, got ${routes.length}: ${JSON.stringify(data)}`);
          if(data?.serviceArea?.name!=='대구광역시'||data?.mixedRouting!=='protected-orchestrator') throw new Error(`Mixed route response lost gate contract: ${JSON.stringify(data)}`);
          const mixed=routes.filter(route=>(route.segments||[]).some(segment=>segment.type==='bus')&&(route.segments||[]).some(segment=>segment.type==='subway'));
          if(data?.mixedAvailable===true&&mixed.length<1) throw new Error(`mixedAvailable=true without a mixed route: ${JSON.stringify(data)}`);
          for(const route of mixed){
            if(route?.estimateMode&&!String(route.estimateMode).startsWith('mixed-static-rail')) throw new Error(`Unexpected mixed estimate mode: ${route.estimateMode}`);
            if(!Array.isArray(route?.realtimeLegs)) throw new Error('Mixed route realtime legs shape is missing');
          }
          console.log(`Live mixed-aware Transit: ${routes.length} route(s), ${mixed.length} mixed route(s), mixedAvailable=${Boolean(data?.mixedAvailable)}`);
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-transit-mixed-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-transit-mixed-server.log
          exit 1
      - name: Verify mixed route rendering across six viewports
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/transit-mixed-ui-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transit-mixed-audit
          path: transit-mixed-audit/
          retention-days: 7
