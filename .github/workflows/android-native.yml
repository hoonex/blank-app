name: Flow Android native audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-native.yml'
      - '.github/workflows/android-release.yml'
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-native.yml'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
      - name: Install Android 17 SDK platform
        shell: bash
        run: |
          set -euo pipefail
          if ! sdkmanager --channel=3 'platforms;android-37.2'; then
            echo '::error::Android 17 platform was not visible to sdkmanager'
            sdkmanager --list --channel=3 | grep -E 'platforms;.*(37|Cinnamon)' || true
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile, test and lint native app
        working-directory: android-app
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon
      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture native UI screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          working-directory: android-app
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/run-visual-audit.sh
      - name: Upload native UI visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flow-android-visual-audit
          path: android-app/build/visual-audit/screenshots/**/*.png
          if-no-files-found: warn
      - name: Upload Android test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flow-android-test-diagnostics
          path: |
            android-app/build/visual-audit/instrumentation.txt
            android-app/app/build/outputs/androidTest-results/**
            android-app/app/build/reports/androidTests/**
          if-no-files-found: warn
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flow-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
