name: Flow Android native audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-native.yml'
      - '.github/workflows/android-release.yml'
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-native.yml'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile, test and lint native app
        working-directory: android-app
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: flow-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
