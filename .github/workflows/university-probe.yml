name: University API probe

on:
  push:
    branches: [feat/university-mode]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe university APIs
        run: |
          echo '=== search ==='
          curl -fsSL 'https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/university-data?action=search&q=%EA%B2%BD%EB%B6%81%EB%8C%80%ED%95%99%EA%B5%90' | tee university-search.json
          echo
          echo '=== majors ==='
          curl -fsSL 'https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/university-data?action=debug-major' | tee university-major.json
          echo
          echo '=== metrics ==='
          curl -fsSL 'https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/university-data?action=debug-metrics' | tee university-metrics.json
          echo
      - uses: actions/upload-artifact@v4
        with:
          name: university-probe
          path: |
            university-search.json
            university-major.json
            university-metrics.json
          retention-days: 2
