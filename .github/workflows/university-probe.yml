name: University API probe

on:
  push:
    branches: [feat/university-mode]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe university API proxy
        run: |
          curl -fsSL 'https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/university-data?action=probe' | tee university-probe.json
          echo
      - uses: actions/upload-artifact@v4
        with:
          name: university-probe
          path: university-probe.json
          retention-days: 2
