name: University API probe

on:
  push:
    branches: [feat/university-mode]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe university API proxy and official swagger
        run: |
          echo '=== school years ==='
          curl -fsSL 'https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/university-data?action=debug-years' | tee university-years.json
          echo

          for item in '15158665 school' '15158666 major' '15158679 condition' '15158680 finance'; do
            set -- $item
            id=$1
            name=$2
            echo "=== $name swagger ==="
            curl -fsSL "https://www.data.go.kr/data/$id/openapi.do" -o "$name.html"
            grep -Eio '.{0,150}(operationId|parameters|serviceKey|svyYr|schlId|schlKrnNm|schlNm|get[A-Za-z0-9_]+).{0,260}' "$name.html" | head -n 180 | tee "$name-hints.txt" || true
            echo
          done
      - uses: actions/upload-artifact@v4
        with:
          name: university-probe
          path: |
            university-years.json
            *-hints.txt
          retention-days: 2
