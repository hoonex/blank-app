name: University API probe

on:
  push:
    branches: [feat/university-mode]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe university API
        run: |
          curl -fsSL 'https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/university-data?action=search&q=%EA%B2%BD%EB%B6%81%EB%8C%80%ED%95%99%EA%B5%90' | tee university-search.json
      - name: Inspect rendered Everytime timetable
        run: node scripts/everytime-probe.mjs | tee everytime-probe.log
      - uses: actions/upload-artifact@v4
        with:
          name: university-probe
          path: |
            university-search.json
            everytime-rendered.json
            everytime-rendered.png
            everytime-probe.log
          retention-days: 2
