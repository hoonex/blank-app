name: University API probe

on:
  push:
    branches: [feat/university-mode]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe university API proxy
        run: |
          echo '=== base ==='
          curl -fsSL 'https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/university-data?action=debug' | tee university-debug.json
          echo
          echo '=== name parameter guesses ==='
          curl -fsSL 'https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/university-data?action=debug-name' | tee university-name-debug.json
          echo
      - uses: actions/upload-artifact@v4
        with:
          name: university-probe
          path: |
            university-debug.json
            university-name-debug.json
          retention-days: 2
