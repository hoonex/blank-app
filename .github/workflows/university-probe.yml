name: University API probe

on:
  push:
    branches: [feat/university-mode]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe university API proxy
        run: |
          echo '=== base ==='
          curl -fsSL 'https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/university-data?action=debug' | tee university-debug.json
          echo
          echo '=== official portal source hints ==='
          curl -fsSL 'https://www.data.go.kr/data/15158665/openapi.do' -o portal.html
          grep -Eio '.{0,140}(getSchoolInfo|SchoolInfoService|swagger|request[^ <]{0,20}|schl[A-Za-z_]*|school[A-Za-z_]*|univ[A-Za-z_]*).{0,220}' portal.html | head -n 120 | tee portal-hints.txt || true
          echo
      - uses: actions/upload-artifact@v4
        with:
          name: university-probe
          path: |
            university-debug.json
            portal-hints.txt
            portal.html
          retention-days: 2
