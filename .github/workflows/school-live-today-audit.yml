name: School live Today audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'school-timetable-polish.js'
      - 'tests/school-live-today-audit.mjs'
      - '.github/workflows/school-live-today-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-today:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources
        run: |
          node --check school-timetable-polish.js
          node --check tests/school-live-today-audit.mjs
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.58.2 install --with-deps chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 >/tmp/flow-live-today-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/flow-live-today-server.log
          exit 1
      - name: Verify Android glass, current period, times, and exam stack
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
          FLOW_TEST_OUT: school-live-today-audit
        run: node tests/school-live-today-audit.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-live-today-audit
          path: school-live-today-audit
          if-no-files-found: ignore
