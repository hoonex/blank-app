name: School home cleanup audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  school-home-cleanup-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate School cleanup sources
        run: |
          set -euo pipefail
          node --check school-surface-cleanup.js
          node --check school-timetable-polish.js
          node --check tests/school-home-cleanup-audit.mjs
          node --check tests/school-wide-portrait-destinations-audit.mjs
          node --check tests/school-mobile-lens-geometry-audit.mjs
          node --check tests/school-today-clay-audit.mjs
          node --check tests/school-today-actions-audit.mjs
          node --check cloudflare-worker.mjs
          test -f school-today-clay.css
          grep -q "school-today-clay.css" school-uiux-v2.js
          grep -q "school-surface-cleanup.js" school-metrics.js
          grep -q "school-surface-cleanup.js" sw.js
          grep -q "flow-school-transit-lab-v1" school-surface-cleanup.js
          grep -q "flow-school-transit-lab-v1" school-metrics.js
          grep -q "data-flow-bell=\\\"mealEnd\\\"" school-surface-cleanup.js
          grep -q "flow-bell-summary" school-surface-cleanup.js
          ! grep -q "^import './school-transit" school-metrics.js
          grep -q "await import('./school-transit.js')" school-metrics.js
          grep -q "await import('./school-transit-map.js')" school-metrics.js
          grep -q "await import('./school-transit-focus.js')" school-metrics.js
          ! grep -q "^const SHELL=.*school-transit" sw.js
          ! grep -q "school-transit-today.js" school-metrics.js
          grep -q "const CACHE='flow-school-shell-v15'" sw.js
          grep -q "FLOW_RELEASE='school-shell-v15-20260831'" cloudflare-worker.mjs
          grep -q "flow-school-production-critical" cloudflare-worker.mjs
          grep -q "flow-school-cache-recovery" cloudflare-worker.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-school-home-cleanup-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-school-home-cleanup-server.log
          exit 1
      - name: Verify simplified School surface across six viewports
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-home-cleanup-audit.mjs
      - name: Verify borderless soft-clay Today masthead over time
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
          FLOW_TEST_OUT: school-home-cleanup-audit/today-clay
        run: node tests/school-today-clay-audit.mjs
      - name: Verify Today action hierarchy and circular period badges
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
          FLOW_TEST_OUT: school-home-cleanup-audit/today-actions
        run: node tests/school-today-actions-audit.mjs
      - name: Verify compact School active lens follows its tab
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
          FLOW_TEST_OUT: school-home-cleanup-audit/mobile-lens
        run: node tests/school-mobile-lens-geometry-audit.mjs
      - name: Verify all School destinations on wide portrait tablets
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
          FLOW_TEST_OUT: school-home-cleanup-audit/wide-portrait-destinations
        run: node tests/school-wide-portrait-destinations-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-home-cleanup-audit
          path: school-home-cleanup-audit/
          retention-days: 7
