name: School Today Transit audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  school-today-transit-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Today Transit bridge sources
        run: |
          set -euo pipefail
          node --check school-transit-today.js
          node --check tests/school-transit-today-audit.mjs
          test -s school-transit-today.css
          grep -q "school-transit-today.js" school-metrics.js
          grep -q "school-transit-today.js" sw.js
          grep -q "school-transit-today.css" sw.js
          grep -q "flow-school-shell-v14" sw.js
          grep -q "flow:transit-routes-rendered" school-transit.js
          grep -q "flow:transit-routes-rendered" school-transit-today.js
          ! grep -q "getCurrentPosition" school-transit-today.js
          ! grep -q "functions/v1/transit-data" school-transit-today.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-school-today-transit.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-school-today-transit.log
          exit 1
      - name: Verify School Today Transit context across six viewports
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-transit-today-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-today-transit-audit
          path: school-transit-today-audit/
          retention-days: 7
