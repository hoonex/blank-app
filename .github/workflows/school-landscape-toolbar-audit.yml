name: School landscape toolbar audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  school-landscape-toolbar-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate sources
        run: |
          set -euo pipefail
          node --check school-metrics.js
          node --check school-tablet-rotation-contract.js
          node --check school-desktop-tablet-redesign.js
          node --check tests/school-landscape-toolbar-audit.mjs
          node --check tests/school-tablet-rotation-audit.mjs
          node --check tests/school-tablet-breakpoint-sweep-audit.mjs
          node --check tests/school-ambient-tablet-shell-audit.mjs
          node --check tests/school-desktop-tablet-redesign-audit.mjs
          test -s school-landscape-toolbar.css
          test -s school-desktop-tablet-redesign.js
          grep -q 'school-landscape-toolbar.css' school-metrics.js
          grep -q 'school-landscape-toolbar.css' sw.js
          grep -q 'school-tablet-rotation-contract.js' school-real-device-refine.js
          grep -q 'school-tablet-rotation-contract.js' sw.js
          grep -q 'school-desktop-tablet-redesign.js' school-metrics.js
          grep -q 'school-desktop-tablet-redesign.js' sw.js
          grep -q 'flowSchoolLayout' school-tablet-rotation-contract.js
          grep -q 'pointer:coarse' school-tablet-rotation-contract.js
          grep -q 'maxTouchPoints' school-tablet-rotation-contract.js
          grep -q '1536px' school-tablet-rotation-contract.js
          grep -q 'orientation:landscape' school-landscape-toolbar.css
          grep -q 'repeat(4,minmax(0,1fr))' school-landscape-toolbar.css
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-school-landscape-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-school-landscape-server.log
          exit 1
      - name: Verify School short-landscape navigation geometry
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-landscape-toolbar-audit.mjs
      - name: Verify School tablet portrait-landscape rotation shell
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-tablet-rotation-audit.mjs
      - name: Sweep School tablet rotation breakpoints
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-tablet-breakpoint-sweep-audit.mjs
      - name: Verify ambient on/off wide-touch tablet shell
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-ambient-tablet-shell-audit.mjs
      - name: Verify redesigned desktop and tablet surfaces
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-desktop-tablet-redesign-audit.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: school-landscape-toolbar-audit
          path: school-landscape-toolbar-audit/
          retention-days: 7
