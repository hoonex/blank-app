name: University dashboard audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate dashboard source
        run: |
          node --check university/dashboard.js
          node --check university/campus-interactive.js
          node --check scripts/dashboard-audit.mjs
          test -f university/dashboard.css
          grep -q "dashboard.js" university/campus-interactive.js
          grep -q "dashboard.js" sw.js
          grep -q "dashboard.css" sw.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-dashboard-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/university/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-dashboard-server.log
          exit 1
      - name: Run dashboard browser audit
        run: node scripts/dashboard-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: university-dashboard-audit
          path: university-audit/
          retention-days: 5
