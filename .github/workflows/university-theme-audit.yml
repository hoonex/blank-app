name: University theme audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate theme audit source
        run: |
          node --check university/ui-unify.js
          node --check scripts/university-theme-audit.mjs
          grep -q 'only light' university/university-polish.css
          grep -q 'flow-school-shell-v12' sw.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-theme-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/university/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-theme-server.log
          exit 1
      - name: Run forced-dark theme audit
        run: node scripts/university-theme-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: university-theme-audit
          path: university-audit/
          retention-days: 5
