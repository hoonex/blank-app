name: DGE symbol research

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'research/dge-symbol-dataset-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect one bounded cached search fallback
        shell: bash
        run: |
          set -euo pipefail
          URL='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/school-logo?host=jungdong.dge.hs.kr&name=%EC%A0%95%EB%8F%99%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&meta=1'
          curl --fail --silent --show-error --location --max-time 20 "$URL" -o /tmp/logo-meta.json
          cat /tmp/logo-meta.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/logo-meta.json',encoding='utf-8'))
          print('FALLBACK_FOUND=', bool(data.get('found')))
          print('FALLBACK_SOURCE=', data.get('source'))
          print('FALLBACK_SCORE=', data.get('score'))
          print('FALLBACK_OFFICIAL=', data.get('official'))
          print('FALLBACK_DOC_HOST=', data.get('docHost'))
          print('FALLBACK_DOC_URL=', data.get('docUrl'))
          PY
