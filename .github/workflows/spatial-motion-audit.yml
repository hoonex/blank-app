name: Spatial motion audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'flow-experience.js'
      - 'flow-experience.css'
      - 'tests/flow-spatial-motion-audit.mjs'
      - '.github/workflows/spatial-motion-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate spatial motion source
        run: |
          set -euo pipefail
          node --check flow-experience.js
          node --check tests/flow-spatial-motion-audit.mjs
          test -s flow-experience.css
          grep -q "flow-motion-v1" flow-experience.js
          grep -q "flow-nav-field" flow-experience.js
          grep -q -- "--flow-spring-out:cubic-bezier(.16,1,.3,1)" flow-experience.css
          ! grep -q 'MutationObserver' flow-experience.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-spatial-motion.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-spatial-motion.log
          exit 1
      - name: Verify magnetic motion and reduced-motion behavior
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/flow-spatial-motion-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-spatial-motion-audit
          path: flow-spatial-motion-audit/
          retention-days: 7
