name: University timetable enhancement audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'university/**'
      - 'scripts/timetable-enhance-audit.mjs'
      - 'scripts/timetable-pinch-density-audit.mjs'
      - 'scripts/timetable-selection-visual-audit.mjs'
      - '.github/workflows/timetable-enhance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timetable-enhance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate sources
        run: |
          node --check university/timetable-enhance.js
          node --check university/timetable-density.js
          node --check scripts/timetable-enhance-audit.mjs
          node --check scripts/timetable-pinch-density-audit.mjs
          node --check scripts/timetable-selection-visual-audit.mjs
          test -s university/timetable-enhance.css
          grep -q "data-time-selection-rail" university/timetable-enhance.js
          grep -q "resizeEdgeForPointer" university/timetable-enhance.js
          ! grep -q "data-time-resize-handle" university/timetable-enhance.js
          grep -q "timetable-enhance.js" university/poi-icons.js
          grep -q "timetable-density.js" university/poi-icons.js
          grep -q "timetable-enhance.js" sw.js
          grep -q "timetable-enhance.css" sw.js
          grep -q "timetable-density.js" sw.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-time-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/university/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-time-server.log
          exit 1
      - name: Run timetable enhancement browser audit
        run: node scripts/timetable-enhance-audit.mjs
      - name: Run timetable pinch density audit
        run: node scripts/timetable-pinch-density-audit.mjs
      - name: Run timetable selection responsive visual audit
        run: node scripts/timetable-selection-visual-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: university-timetable-enhance-audit
          path: university-audit/
          retention-days: 5
