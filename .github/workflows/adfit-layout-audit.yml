name: Kakao AdFit layout audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adfit-layout-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate AdFit sources
        run: |
          node --check flow-adfit-config.js
          node --check flow-adfit.js
          node --check tests/adfit-layout-audit.mjs
          grep -q 't1.kakaocdn.net/kas/static/ba.min.js' flow-adfit-config.js
          grep -q 'kakao_ad_area' flow-adfit.js
          grep -q "unit:''" flow-adfit-config.js
          ! grep -q 'flow-optical-jelly-v1' flow-adfit-config.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-adfit-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep .3
          done
          cat /tmp/flow-adfit-server.log
          exit 1
      - name: Verify School and University AdFit composition across six viewports
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/adfit-layout-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adfit-layout-audit
          path: adfit-layout-audit/
          retention-days: 7
