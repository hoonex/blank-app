name: Liquid Glass live stability audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liquid-glass-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources
        run: |
          node --check flow-refraction.js
          node --check tests/liquid-glass-live-stability-audit.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-liquid-glass-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep .3
          done
          cat /tmp/flow-liquid-glass-server.log
          exit 1
      - name: Verify Standard and Optical live geometry
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/liquid-glass-live-stability-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: liquid-glass-stability-audit
          path: liquid-glass-stability-audit/
          retention-days: 7
