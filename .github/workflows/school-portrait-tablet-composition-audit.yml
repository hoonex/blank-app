name: School portrait tablet composition audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portrait-tablet-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate portrait tablet audit sources
        run: |
          set -euo pipefail
          node --check tests/school-portrait-tablet-composition-audit.mjs
          grep -q 'Wide portrait tablets must use the same content composition as mobile portrait' school-uiux-v2-system.css
          grep -q 'max-width:1024px' school-uiux-v2-system.css
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-portrait-tablet-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-portrait-tablet-server.log
          exit 1
      - name: Verify portrait tablet uses full mobile composition
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-portrait-tablet-composition-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-portrait-tablet-composition-audit
          path: school-portrait-tablet-composition-audit/
          retention-days: 7
