name: School media v13 smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-media-smoke:
    if: github.head_ref == 'verify/school-media-v13-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify official Jeongdong school mark
        run: |
          set -euo pipefail
          URL='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/school-data?action=media&office=D10&school=7240101'
          curl --fail --silent --show-error --max-time 20 "$URL" -o /tmp/media.json
          cat /tmp/media.json
          python3 - <<'PY'
          import json
          with open('/tmp/media.json', encoding='utf-8') as f:
              data=json.load(f)
          media=data.get('media') or {}
          source=media.get('logoSource')
          logo=media.get('logo') or ''
          assert source == 'official-dge-symbol', (source, logo, data)
          assert '.dge.hs.kr/' in logo, logo
          print('official school mark OK:', source, logo)
          PY
