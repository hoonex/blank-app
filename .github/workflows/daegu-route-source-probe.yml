name: Daegu route source probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reuse verified official archive artifact
        uses: actions/download-artifact@v4
        with:
          name: daegu-route-source-analysis
          path: /tmp/daegu-seed
          github-token: ${{ github.token }}
          run-id: 33259103347
      - name: Verify official archive and build compact network
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/daegu-seed/daegu-bus-spatial-20250903.zip
          test -s "$archive"
          echo '98d6a7725e3fddbcd65c58af3fadc217378ee8bfec82e29e2931341e19f86a1e  '"$archive" | sha256sum -c -
          rm -rf /tmp/daegu-source && mkdir -p /tmp/daegu-source
          unzip -q "$archive" -d /tmp/daegu-source
          python3 -m pip install --quiet pyshp pyproj shapely scipy
          python3 scripts/build-daegu-bus-network.py /tmp/daegu-source supabase/functions/transit-map/daegu-official-network.ts --archive "$archive"
          test "$(stat -c%s supabase/functions/transit-map/daegu-official-network.ts)" -gt 700000
          test "$(stat -c%s supabase/functions/transit-map/daegu-official-network.ts)" -lt 1100000
      - name: Verify known official 805 corridor exists
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import shapefile, heapq
          from pathlib import Path
          from scipy.spatial import cKDTree
          root=Path('/tmp/daegu-source')
          nr=shapefile.Reader(str(root/'node_20250903.shp'),encoding='utf-8'); nf=[f[0] for f in nr.fields[1:]]
          nodes=[]; ids=[]
          for sr in nr.iterShapeRecords():
              rec=dict(zip(nf,sr.record)); nodes.append(sr.shape.points[0]); ids.append(str(rec['node_id']))
          index={v:i for i,v in enumerate(ids)}; tree=cKDTree(nodes)
          lr=shapefile.Reader(str(root/'link_20250903.shp'),encoding='utf-8'); lf=[f[0] for f in lr.fields[1:]]
          adj={}; links=[]
          for sr in lr.iterShapeRecords():
              rec=dict(zip(lf,sr.record)); pts=sr.shape.points; ep=[]
              for p in (pts[0],pts[-1]):
                  d,i=tree.query(p); ep.append(int(i) if d<=60 else None)
              if None in ep: continue
              length=float(rec.get('shape_len') or 0); li=len(links); links.append((rec,pts))
              adj.setdefault(ep[0],[]).append((ep[1],length,li)); adj.setdefault(ep[1],[]).append((ep[0],length,li))
          a=index['7011018400']; b=index['7011015400']; pq=[(0,a)]; dist={a:0}; prev={}
          while pq:
              d,u=heapq.heappop(pq)
              if d!=dist[u]: continue
              if u==b: break
              for v,w,li in adj.get(u,[]):
                  nd=d+w
                  if nd<dist.get(v,1e100): dist[v]=nd; prev[v]=(u,li); heapq.heappush(pq,(nd,v))
          if b not in dist: raise SystemExit('Official 805 corridor is disconnected')
          route=[]; u=b
          while u!=a:
              u0,li=prev[u]; route.append(li); u=u0
          route.reverse(); names=[links[li][0]['link_nm'] for li in route]
          if not any(name=='반야월로' for name in names): raise SystemExit(f'805 corridor did not reach 반야월로: {names}')
          if not 1800 <= dist[b] <= 2800: raise SystemExit(f'Unexpected 805 corridor distance: {dist[b]}')
          print({'distanceMeters':round(dist[b],1),'linkCount':len(route),'roads':names})
          PY
      - name: Commit generated snapshot to branch
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/functions/transit-map/daegu-official-network.ts
          if git diff --cached --quiet; then echo 'Generated snapshot already current'; exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'data: add official Daegu bus link snapshot'
          git push origin HEAD:${GITHUB_HEAD_REF}
