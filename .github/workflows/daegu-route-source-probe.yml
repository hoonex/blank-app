name: Daegu route source probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official Daegu bus spatial dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/daegu-route/source /tmp/daegu-route/geojson
          url='https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000003540272&fileDetailSn=1&insertDataPrcus=N'
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
            "$url" -o /tmp/daegu-route/daegu-bus-spatial-20250903.zip
          test "$(stat -c%s /tmp/daegu-route/daegu-bus-spatial-20250903.zip)" -gt 2000000
          file /tmp/daegu-route/daegu-bus-spatial-20250903.zip
          sha256sum /tmp/daegu-route/daegu-bus-spatial-20250903.zip | tee /tmp/daegu-route/sha256.txt
          unzip -l /tmp/daegu-route/daegu-bus-spatial-20250903.zip | tee /tmp/daegu-route/unzip-list.txt
          unzip -q /tmp/daegu-route/daegu-bus-spatial-20250903.zip -d /tmp/daegu-route/source
          find /tmp/daegu-route/source -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort | tee /tmp/daegu-route/files.txt

      - name: Install GIS inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdal-bin python3-gdal >/dev/null
          ogrinfo --version

      - name: Inspect SHP schemas, CRS, bounds, and sample records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json, os
          root=Path('/tmp/daegu-route/source')
          out=Path('/tmp/daegu-route')
          shps=sorted(root.rglob('*.shp'))
          if not shps:
              raise SystemExit('No .shp files found in official archive')
          report=[]
          for shp in shps:
              rel=str(shp.relative_to(root))
              summary=subprocess.run(['ogrinfo','-ro','-so','-al',str(shp)],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,check=True).stdout
              sample=subprocess.run(['ogrinfo','-ro','-al','-limit','4',str(shp)],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,check=True).stdout
              (out/f'{shp.stem}.summary.txt').write_text(summary,'utf-8')
              (out/f'{shp.stem}.sample.txt').write_text(sample,'utf-8')
              target=out/'geojson'/f'{shp.stem}.geojson'
              subprocess.run(['ogr2ogr','-f','GeoJSON','-t_srs','EPSG:4326','-lco','RFC7946=YES',str(target),str(shp)],check=True)
              gj=json.loads(target.read_text('utf-8'))
              feats=gj.get('features',[])
              fields=sorted({k for f in feats[:100] for k in (f.get('properties') or {}).keys()})
              types={}
              for f in feats[:200]:
                  t=((f.get('geometry') or {}).get('type') or 'null')
                  types[t]=types.get(t,0)+1
              report.append({'file':rel,'featureCount':len(feats),'fields':fields,'geometryTypesSample':types,'summary':summary[:12000]})
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps([{k:v for k,v in x.items() if k!='summary'} for x in report],ensure_ascii=False,indent=2))
          PY

      - name: Analyze route identifiers and known bus lines
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, math
          root=Path('/tmp/daegu-route/geojson')
          known=['805','708','250','814','401']
          result={}
          for p in sorted(root.glob('*.geojson')):
              data=json.loads(p.read_text('utf-8'))
              feats=data.get('features',[])
              rows=[]
              for i,f in enumerate(feats):
                  props=f.get('properties') or {}
                  text=' | '.join(str(v) for v in props.values() if v is not None)
                  matches=[line for line in known if re.search(rf'(^|[^0-9]){re.escape(line)}([^0-9]|$)',text)]
                  if matches:
                      geom=f.get('geometry') or {}
                      coords=geom.get('coordinates')
                      rows.append({'index':i,'matches':matches,'properties':props,'geometryType':geom.get('type'),'coordinateShape':str(type(coords).__name__)})
              result[p.name]={'featureCount':len(feats),'knownMatches':rows[:100]}
          Path('/tmp/daegu-route/known-lines.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2)[:30000])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daegu-route-source-analysis
          path: /tmp/daegu-route
          retention-days: 3
