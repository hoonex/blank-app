name: Edge secret contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-secret-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check university Edge Function syntax
        run: node --experimental-strip-types --check supabase/functions/university-data/index.ts
      - name: Validate secret mapping
        run: node scripts/edge-secret-contract.mjs
