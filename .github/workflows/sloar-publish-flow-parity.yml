name: Sloar publish Flow mode parity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish-product-tree:
    if: github.event.pull_request.head.ref == 'supply/flow-parity-final-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PRODUCT_HEAD: ec92cab253750bd099b53bf0d2250c8a2bc6a565
      PRODUCT_TREE: 87b301e1d689c2ec04abb69b214896521d6e4a85
      FINAL_TREE: da0335932a6e8ca716c2cc991b8b0228bbd2489b
      PATCH_SHA: f82e8d2a159d17ad446c4031a96595f803b436b38aeb2b3c68353ff4221b5046
      PAYLOAD_SHA: c412ba55a6527771b3af1eecbba829dee5a57f2fde1bb2dfe3deb09de45a9522
      TARGET_BRANCH: feat/school-university-mode-consistency-20260821
    steps:
      - name: Checkout transport inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fix and publish exact product tree
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/flow-parity-fix"
          mkdir -p "$tmp"
          cp .sloar/flow-font-audit-fix.patch.gz.b64 "$tmp/payload.b64"
          printf '%s  %s\n' "$PAYLOAD_SHA" "$tmp/payload.b64" | sha256sum -c -
          base64 -d "$tmp/payload.b64" | gzip -dc > "$tmp/fix.patch"
          printf '%s  %s\n' "$PATCH_SHA" "$tmp/fix.patch" | sha256sum -c -

          git cat-file -e "$PRODUCT_HEAD^{commit}"
          test "$(git rev-parse "$PRODUCT_HEAD^{tree}")" = "$PRODUCT_TREE"
          git checkout --detach "$PRODUCT_HEAD"
          git apply --check "$tmp/fix.patch"
          git apply "$tmp/fix.patch"
          git diff --check
          node --check scripts/university-audit.mjs
          node --check scripts/memo-panel-audit.mjs

          expected_paths="$(printf '%s\n' scripts/memo-panel-audit.mjs scripts/university-audit.mjs university/index.html | sort)"
          actual_paths="$(git diff --name-only | sort)"
          test "$actual_paths" = "$expected_paths"

          git add scripts/memo-panel-audit.mjs scripts/university-audit.mjs university/index.html
          test "$(git write-tree)" = "$FINAL_TREE"

          git config user.name 'hoonex'
          git config user.email '163626004+hoonex@users.noreply.github.com'
          git commit -m 'fix: align University fonts and parity audits'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force-with-lease="refs/heads/$TARGET_BRANCH:$PRODUCT_HEAD"
