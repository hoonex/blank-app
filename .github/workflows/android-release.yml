name: Flow Android preview release

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PRIMARY_CACHE_KEY: flow-android-preview-signing-v1-primary-Linux
  BACKUP_CACHE_KEY: flow-android-preview-signing-v1-backup-Linux

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager --channel=3 'platforms;android-37' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # PREVIEW SIGNING ONLY. This intentionally mirrors the cache-backed signing
      # approach used for private preview distribution. Public production should
      # move the durable keystore to GitHub Secrets or Play App Signing.
      - name: Restore primary preview signer
        id: primary
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/flow-signing/primary
          key: ${{ env.PRIMARY_CACHE_KEY }}
      - name: Restore backup preview signer
        id: backup
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/flow-signing/backup
          key: ${{ env.BACKUP_CACHE_KEY }}
      - name: Establish signing continuity
        id: signing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$HOME/.android/flow-signing"
          PRIMARY="$ROOT/primary/release.jks"
          BACKUP="$ROOT/backup/release.jks"
          PRIMARY_META="$ROOT/primary/signing.env"
          BACKUP_META="$ROOT/backup/signing.env"
          mkdir -p "$ROOT/primary" "$ROOT/backup"
          PRIMARY_OK=false; BACKUP_OK=false
          [ -s "$PRIMARY" ] && [ -s "$PRIMARY_META" ] && PRIMARY_OK=true
          [ -s "$BACKUP" ] && [ -s "$BACKUP_META" ] && BACKUP_OK=true
          PREVIOUS_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and (.tag_name | startswith("android-v")) and (([.assets[].name] | index("ANDROID_SIGNING_CERT_SHA256.txt")) != null))][0].tag_name // ""')"
          if [ "$PRIMARY_OK" = true ] && [ "$BACKUP_OK" = true ]; then
            cmp -s "$PRIMARY" "$BACKUP" && cmp -s "$PRIMARY_META" "$BACKUP_META" || { echo '::error::Signing caches disagree'; exit 1; }
          elif [ "$PRIMARY_OK" = true ]; then
            cp "$PRIMARY" "$BACKUP"; cp "$PRIMARY_META" "$BACKUP_META"
          elif [ "$BACKUP_OK" = true ]; then
            cp "$BACKUP" "$PRIMARY"; cp "$BACKUP_META" "$PRIMARY_META"
          else
            if [ -n "$PREVIOUS_TAG" ]; then echo "::error::Both signing caches are missing after $PREVIOUS_TAG; refusing signer rotation"; exit 1; fi
            STORE_VALUE="$(openssl rand -base64 36 | tr -d '\r\n')"
            KEY_VALUE="$(openssl rand -base64 36 | tr -d '\r\n')"
            KEY_ALIAS="flow-preview-update"
            keytool -genkeypair -keystore "$PRIMARY" -storetype JKS -storepass "$STORE_VALUE" -keypass "$KEY_VALUE" -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=Flow Preview Update,OU=Personal,O=hoonex,C=KR' -noprompt
            printf 'STORE_VALUE=%s\nKEY_VALUE=%s\nKEY_ALIAS=%s\n' "$STORE_VALUE" "$KEY_VALUE" "$KEY_ALIAS" > "$PRIMARY_META"
            chmod 600 "$PRIMARY" "$PRIMARY_META"
            cp "$PRIMARY" "$BACKUP"; cp "$PRIMARY_META" "$BACKUP_META"
          fi
          set -a; . "$PRIMARY_META"; set +a
          keytool -exportcert -rfc -keystore "$PRIMARY" -storepass "$STORE_VALUE" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/cert.pem"
          SIGNER="$(openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -fingerprint -sha256 | sed 's/^[^=]*=//' | tr -d ':\r\n ' | tr '[:lower:]' '[:upper:]')"
          if [ -n "$PREVIOUS_TAG" ]; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$PREVIOUS_TAG" --pattern 'ANDROID_SIGNING_CERT_SHA256.txt' --dir "$RUNNER_TEMP/previous"
            EXPECTED="$(tr -d ':\r\n ' < "$RUNNER_TEMP/previous/ANDROID_SIGNING_CERT_SHA256.txt" | tr '[:lower:]' '[:upper:]')"
            [ "$SIGNER" = "$EXPECTED" ] || { echo '::error::Cached signer does not match release lineage'; exit 1; }
          fi
          printf '%s\n' "$SIGNER" > "$RUNNER_TEMP/ANDROID_SIGNING_CERT_SHA256.txt"
          echo "cert=$SIGNER" >> "$GITHUB_OUTPUT"
      - name: Save primary signing cache
        if: steps.primary.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/flow-signing/primary
          key: ${{ env.PRIMARY_CACHE_KEY }}
      - name: Save backup signing cache
        if: steps.backup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/flow-signing/backup
          key: ${{ env.BACKUP_CACHE_KEY }}

      - name: Build signed APK
        id: meta
        shell: bash
        env:
          FLOW_EXPECTED_SIGNER_SHA256: ${{ steps.signing.outputs.cert }}
        run: |
          set -euo pipefail
          set -a; . "$HOME/.android/flow-signing/primary/signing.env"; set +a
          export ANDROID_KEYSTORE_PATH="$HOME/.android/flow-signing/primary/release.jks"
          export ANDROID_KEYSTORE_PASSWORD="$STORE_VALUE"
          export ANDROID_KEY_ALIAS="$KEY_ALIAS"
          export ANDROID_KEY_PASSWORD="$KEY_VALUE"
          export FLOW_VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          export FLOW_VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          cd android-app
          gradle :app:assembleRelease :app:testReleaseUnitTest --stacktrace --no-daemon
          cd ..
          APK='android-app/app/build/outputs/apk/release/app-release.apk'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt"
          APK_SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n1 | tr -d ':\r\n ' | tr '[:lower:]' '[:upper:]')"
          [ "$APK_SIGNER" = "$FLOW_EXPECTED_SIGNER_SHA256" ] || { cat "$RUNNER_TEMP/apksigner.txt"; echo '::error::APK signer mismatch'; exit 1; }
          VERSION_NAME="$FLOW_VERSION_NAME"
          VERSION_CODE="$FLOW_VERSION_CODE"
          OUT="Flow-Android-v${VERSION_NAME}.apk"
          mkdir -p release
          cp "$APK" "release/$OUT"
          SHA="$(sha256sum "release/$OUT" | awk '{print toupper($1)}')"
          cp "$RUNNER_TEMP/ANDROID_SIGNING_CERT_SHA256.txt" release/ANDROID_SIGNING_CERT_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > release/SOURCE_COMMIT.txt
          jq -n --arg apkName "$OUT" --arg apkSha256 "$SHA" --arg signerSha256 "$FLOW_EXPECTED_SIGNER_SHA256" --arg versionName "$VERSION_NAME" --argjson versionCode "$VERSION_CODE" --arg sourceSha "$GITHUB_SHA" '{schema:1,apkName:$apkName,apkSha256:$apkSha256,signerSha256:$signerSha256,versionName:$versionName,versionCode:$versionCode,sourceSha:$sourceSha}' > release/flow-android-release.json
          (cd release && sha256sum "$OUT" flow-android-release.json ANDROID_SIGNING_CERT_SHA256.txt SOURCE_COMMIT.txt > SHA256SUMS.txt)
          echo "tag=android-v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
      - name: Publish immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo "::error::$TAG already exists"; exit 1; fi
          gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Flow Android v$VERSION" --notes "Native Flow University preview. Cache-backed preview signing is used; public production distribution should migrate to durable secret-backed signing or Play App Signing." --latest=false
