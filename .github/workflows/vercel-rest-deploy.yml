name: Vercel REST deploy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.json'
      - '*.xml'
      - '*.txt'
      - 'university/**'
      - 'admin/**'
      - 'scripts/vercel-rest.mjs'
      - 'scripts/vercel-static-build.mjs'
      - '.github/workflows/vercel-rest-deploy.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - '*.json'
      - '*.xml'
      - '*.txt'
      - 'university/**'
      - 'admin/**'
      - 'scripts/vercel-rest.mjs'
      - 'scripts/vercel-static-build.mjs'
      - '.github/workflows/vercel-rest-deploy.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: flow-vercel-production-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: team_jZtmaTEMCNsqutNYWwFUpxAS
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PROJECT_NAME: flow-student
      VERCEL_DISABLE_AUTH: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment manifest
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/vercel-rest.mjs
          node --check scripts/vercel-static-build.mjs
          node scripts/vercel-rest.mjs manifest > /tmp/vercel-manifest.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('/tmp/vercel-manifest.json','utf8'));
          const files=new Set(manifest?.files||[]);
          const routes=new Set(manifest?.cleanRoutes||[]);
          if(!files.has('scripts/vercel-static-build.mjs')) throw new Error('Vercel build helper is missing from REST deployment files');
          if(!files.has('transit/index.html')) throw new Error('Transit clean-route fallback is missing from REST deployment files');
          if(!routes.has('/transit')) throw new Error('Transit clean route is missing from REST verification');
          if(!Number.isInteger(manifest?.fileCount)||manifest.fileCount!==files.size) throw new Error('Vercel manifest file count is inconsistent');
          console.log(`Vercel REST manifest ready: ${manifest.fileCount} source assets; /transit verified`);
          NODE

      - name: Deploy through Vercel REST API
        id: deploy
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/vercel-rest.mjs deploy 2>&1 | tee /tmp/vercel-deploy.log

      - name: Explain missing token
        if: github.event_name != 'pull_request' && env.VERCEL_TOKEN == ''
        run: |
          echo 'VERCEL_TOKEN is not configured yet.' | tee /tmp/vercel-deploy.log
          echo 'The REST deployment module is installed and validated; production deploy is intentionally skipped.' | tee -a /tmp/vercel-deploy.log

      - name: Publish deployment result
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Vercel REST deploy — ${GITHUB_SHA:0:7}"
            echo
            echo '```text'
            tail -n 40 /tmp/vercel-deploy.log 2>/dev/null || echo 'No deployment log was produced.'
            echo '```'
          } > /tmp/deploy-comment.md
          gh issue comment 14 --repo hoonex/blank-app --body-file /tmp/deploy-comment.md

      - name: Fail when REST deployment failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
