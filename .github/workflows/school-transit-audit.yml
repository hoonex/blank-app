name: School transit audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  school-transit-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate transit and secret sources
        run: |
          set -euo pipefail
          node --check school-transit.js
          node --check school-transit-map.js
          node --check tests/school-transit-audit.mjs
          node --check tests/school-transit-destination-suggestions-audit.mjs
          node --check tests/school-transit-map-audit.mjs
          node --check tests/transit-live-map-audit.mjs
          node scripts/edge-secret-audit.mjs
          test -s school-transit.css
          test -s school-transit-map.css
          test -s supabase/functions/transit-data/index.ts
          test -s supabase/functions/transit-data-core/index.ts
          test -s supabase/functions/transit-map/index.ts
          test -s supabase/functions/transit-map/official-route-geometry.ts
          test -s supabase/functions/transit-map/daegu-official-network.ts
          test -s supabase/functions/transit-rail/index.ts
          test -s supabase/functions/university-data/bootstrap.ts
          grep -q "school-transit.js" school-metrics.js
          grep -q "school-transit-map.js" school-metrics.js
          grep -q "school-transit-map.js" sw.js
          grep -q "school-transit-map.css" sw.js
          grep -q "school-transit.css" sw.js
          grep -q "'/transit':'/index.html'" cloudflare-worker.mjs
          grep -q '"source": "/transit"' vercel.json
          grep -q "KAKAO_REST_KEY" supabase/functions/transit-data/index.ts
          grep -q "destination-search" supabase/functions/transit-data/index.ts
          grep -q "Kakao-Local-keyword+address" supabase/functions/transit-data/index.ts
          grep -q "destinationName" school-transit.js
          grep -q "data-destination-suggestion" school-transit.js
          grep -q "OUT_OF_SERVICE_AREA" supabase/functions/transit-data/index.ts
          grep -q "daegu-only-source+destination" supabase/functions/transit-data/index.ts
          grep -q "대구광역시" supabase/functions/transit-data/index.ts
          grep -q "DATA_GO_KR_SERVICE_KEY" supabase/functions/transit-data-core/index.ts
          grep -q "KAKAO_REST_KEY" supabase/functions/transit-data-core/index.ts
          ! grep -q "ODSAY_API_KEY" supabase/functions/transit-data-core/index.ts
          grep -q "TAGO-public-data" supabase/functions/transit-data-core/index.ts
          grep -q "getCtyCodeList" supabase/functions/transit-data-core/index.ts
          grep -q "getSttnNoList" supabase/functions/transit-data-core/index.ts
          grep -q "city-stop-master" supabase/functions/transit-data-core/index.ts
          grep -q "realtimeLegs" supabase/functions/transit-data-core/index.ts
          grep -q "cache-age-adjusted-per-bus-leg" supabase/functions/transit-data-core/index.ts
          grep -q "provider-fetchedAt+cache-age-adjusted" supabase/functions/transit-data-core/index.ts
          grep -q "coordinate-owned-source+destination" supabase/functions/transit-data-core/index.ts
          grep -q "node-id+walkable-stop-proximity" supabase/functions/transit-data-core/index.ts
          grep -q "transferWalkMeters" supabase/functions/transit-data-core/index.ts
          grep -q "busError" school-transit.js
          grep -q "getRouteAcctoBusLcList" supabase/functions/transit-map/index.ts
          grep -q "daegu-official-bus-link-snapshot" supabase/functions/transit-map/index.ts
          grep -q "buildOfficialRouteGeometry" supabase/functions/transit-map/index.ts
          grep -q 'OFFICIAL_ROUTE_SNAPSHOT="2025-09-03"' supabase/functions/transit-map/daegu-official-network.ts
          grep -q '98d6a7725e3fddbcd65c58af3fadc217378ee8bfec82e29e2931341e19f86a1e' supabase/functions/transit-map/daegu-official-network.ts
          grep -q "official-road-geometry" school-transit-map.js
          ! grep -q "smooth-stop-guide" school-transit-map.js
          grep -q "KAKAO_REST_KEY" supabase/functions/transit-rail/index.ts
          grep -q "KRIC-snapshot+Kakao-SW8" supabase/functions/transit-rail/index.ts
          grep -q "Daegu-1-2-3" supabase/functions/transit-rail/index.ts
          grep -q "repeat(5,minmax(0,1fr))" school-transit.css
          grep -q "지원 지역 · 대구광역시" school-transit.css
      - name: Verify live Transit integrations, Daegu service boundary, route search, rail routing, and official map adapter
        shell: bash
        run: |
          set -euo pipefail
          base='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/transit-data'
          map_base='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/transit-map'
          rail_base='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/transit-rail'
          curl -fsSL --connect-timeout 10 --max-time 30 "$base?action=health" > /tmp/transit-health.json
          curl -fsSL --connect-timeout 10 --max-time 30 "$map_base?action=health" > /tmp/transit-map-health.json
          curl -fsSL --connect-timeout 10 --max-time 30 "$rail_base?action=health" > /tmp/transit-rail-health.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/transit-health.json','utf8'));
          const integrations=data?.integrations||{};
          const missing=Object.entries(integrations).filter(([,ready])=>ready!==true).map(([name])=>name);
          if(!data?.ok||missing.length) throw new Error(`Transit integrations are not ready: ${missing.join(', ')||'health failed'}`);
          if(data?.routingProvider!=='TAGO-public-data') throw new Error(`Unexpected Transit provider: ${data?.routingProvider}`);
          if(data?.destinationSearch!=='Kakao-Local-keyword+address') throw new Error(`Transit destination search is not active: ${data?.destinationSearch||'missing'}`);
          if(!Array.isArray(data?.stopDiscovery)||!data.stopDiscovery.includes('city-stop-master')) throw new Error('Transit city-stop fallback is not active');
          if(data?.realtimeRouting!=='cache-age-adjusted-per-bus-leg') throw new Error(`Transit cache-age-adjusted per-leg realtime capability is not active: ${data?.realtimeRouting||'missing'}`);
          if(data?.realtimeFreshness!=='provider-fetchedAt+cache-age-adjusted') throw new Error(`Transit realtime freshness provenance is not active: ${data?.realtimeFreshness||'missing'}`);
          if(data?.regionalRouting!=='daegu-only-source+destination') throw new Error(`Transit Daegu-only gate is not active: ${data?.regionalRouting||'missing'}`);
          if(data?.serviceArea?.id!=='daegu'||data?.serviceArea?.name!=='대구광역시'||data?.serviceArea?.policy!=='source+destination-inside') throw new Error(`Unexpected Transit service area: ${JSON.stringify(data?.serviceArea)}`);
          if(data?.transferMatching!=='node-id+walkable-stop-proximity') throw new Error(`Transit transfer matching is not active: ${data?.transferMatching||'missing'}`);
          const map=JSON.parse(fs.readFileSync('/tmp/transit-map-health.json','utf8'));
          if(!map?.ok||map?.provider!=='TAGO-public-data+Daegu-official-SHP'||map?.geometry!=='daegu-official-bus-link-snapshot'||map?.geometrySnapshot!=='2025-09-03'||map?.geometryFallback!=='route-stop-sequence') throw new Error(`Transit official map adapter is not ready: ${JSON.stringify(map)}`);
          const rail=JSON.parse(fs.readFileSync('/tmp/transit-rail-health.json','utf8'));
          if(!rail?.ok||rail?.provider!=='KRIC-snapshot+Kakao-SW8'||rail?.coverage!=='Daegu-1-2-3'||rail?.snapshotDate!=='2026-06-30'||rail?.realtime!==false||rail?.waitModel!=='estimated') throw new Error(`Transit rail adapter is not ready: ${JSON.stringify(rail)}`);
          console.log('Transit integrations: destination suggestions + Daegu-only gate + cache-age-adjusted TAGO realtime + official Daegu road geometry + Daegu rail ready');
          NODE
          suggest_status=$(curl -sSL -o /tmp/transit-destination-suggestions.json -w '%{http_code}' --get --connect-timeout 10 --max-time 30 \
            --data-urlencode 'action=destination-search' \
            --data-urlencode 'query=동대구' \
            --data-urlencode 'sx=128.6014' \
            --data-urlencode 'sy=35.8714' \
            "$base")
          if [ "$suggest_status" != "200" ]; then
            echo "Transit destination search HTTP $suggest_status"
            cat /tmp/transit-destination-suggestions.json
            echo
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/transit-destination-suggestions.json','utf8'));
          const suggestions=Array.isArray(data?.suggestions)?data.suggestions:[];
          if(data?.provider!=='Kakao-Local'||suggestions.length<1||suggestions.length>6) throw new Error(`Unexpected destination suggestions: ${JSON.stringify(data)}`);
          if(!suggestions.some(item=>String(item?.name||'').includes('동대구'))) throw new Error(`Dongdaegu related places missing: ${JSON.stringify(suggestions)}`);
          if(!suggestions.every(item=>Number.isFinite(Number(item?.x))&&Number.isFinite(Number(item?.y))&&String(item?.address||'').startsWith('대구'))) throw new Error(`Destination suggestion metadata is incomplete: ${JSON.stringify(suggestions)}`);
          console.log(`Live destination suggestions: ${suggestions.length} Kakao place/address candidate(s)`);
          NODE
          route_status=$(curl -sSL -o /tmp/transit-route.json -w '%{http_code}' --get --connect-timeout 10 --max-time 80 \
            --data-urlencode 'action=route' \
            --data-urlencode 'sx=128.6014' \
            --data-urlencode 'sy=35.8714' \
            --data-urlencode 'destination=대구광역시 북구 대학로 80' \
            "$base")
          if [ "$route_status" != "200" ]; then
            echo "Transit route HTTP $route_status"
            cat /tmp/transit-route.json
            echo
            exit 1
          fi
          outside_status=$(curl -sSL -o /tmp/transit-outside.json -w '%{http_code}' --get --connect-timeout 10 --max-time 30 \
            --data-urlencode 'action=route' \
            --data-urlencode 'sx=128.485925' \
            --data-urlencode 'sy=35.955765' \
            --data-urlencode 'destination=대구광역시 동구 용계로1길 49' \
            "$base")
          if [ "$outside_status" != "422" ]; then
            echo "Outside-Daegu Transit expected HTTP 422, got $outside_status"
            cat /tmp/transit-outside.json
            echo
            exit 1
          fi
          rail_status=$(curl -sSL -o /tmp/transit-rail-route.json -w '%{http_code}' --get --connect-timeout 10 --max-time 35 \
            --data-urlencode 'action=route' \
            --data-urlencode 'sx=128.5935' \
            --data-urlencode 'sy=35.8656' \
            --data-urlencode 'ex=128.6272' \
            --data-urlencode 'ey=35.8796' \
            "$rail_base")
          if [ "$rail_status" != "200" ]; then
            echo "Transit rail HTTP $rail_status"
            cat /tmp/transit-rail-route.json
            echo
            exit 1
          fi
          MAP_BASE="$map_base" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/transit-route.json','utf8'));
          const routes=Array.isArray(data?.routes)?data.routes:[];
          if(routes.length<1||routes.length>5) throw new Error(`Expected 1-5 live routes, got ${routes.length}: ${data?.error||'unknown response'}`);
          if(data?.provider!=='TAGO-public-data') throw new Error(`Unexpected route provider: ${data?.provider}`);
          if(data?.serviceArea?.name!=='대구광역시') throw new Error(`Route response lost service area: ${JSON.stringify(data?.serviceArea)}`);
          if(!routes.every(route=>Number(route.totalMinutes)>0&&Array.isArray(route.segments)&&route.segments.length)) throw new Error('Live route normalization is incomplete');
          if(!routes.every(route=>Array.isArray(route.realtimeLegs))) throw new Error('Per-leg realtime shape is missing from live routes');
          const liveLegs=routes.flatMap(route=>route.realtimeLegs||[]);
          if(liveLegs.length){
            const generated=Date.parse(data.generatedAt);
            for(const leg of liveLegs){
              if(!Number.isInteger(leg.ageSeconds)||leg.ageSeconds<0||leg.ageSeconds>60) throw new Error(`Unexpected live arrival age: ${JSON.stringify(leg)}`);
              const checked=Date.parse(leg.checkedAt);
              if(!Number.isFinite(checked)||!Number.isFinite(generated)||checked>generated) throw new Error(`Live arrival checkedAt lost provider provenance: ${JSON.stringify(leg)}`);
            }
          }
          const outside=JSON.parse(fs.readFileSync('/tmp/transit-outside.json','utf8'));
          if(outside?.code!=='OUT_OF_SERVICE_AREA'||outside?.position!=='source'||outside?.serviceArea?.name!=='대구광역시') throw new Error(`Outside-Daegu gate contract failed: ${JSON.stringify(outside)}`);
          const rail=JSON.parse(fs.readFileSync('/tmp/transit-rail-route.json','utf8'));
          const railRoutes=Array.isArray(rail?.routes)?rail.routes:[];
          if(railRoutes.length<1||railRoutes.length>5) throw new Error(`Expected 1-5 live Daegu rail routes, got ${railRoutes.length}: ${rail?.error||'unknown response'}`);
          if(rail?.provider!=='KRIC-snapshot+Kakao-SW8'||rail?.waitModel!=='estimated') throw new Error(`Unexpected rail contract: ${JSON.stringify(rail)}`);
          if(!railRoutes.every(route=>Number(route.totalMinutes)>0&&(route.segments||[]).some(segment=>segment.type==='subway'))) throw new Error('Live rail normalization is incomplete');
          const bus=routes.flatMap(route=>route.segments||[]).find(segment=>segment.type==='bus'&&segment.startId&&segment.endId&&segment.lines?.[0]);
          if(!bus) throw new Error('No live bus segment available for map adapter validation');
          const params=new URLSearchParams({action:'route-map',region:'대구광역시',line:String(bus.lines[0]),startId:String(bus.startId),endId:String(bus.endId),startName:String(bus.startName||''),endName:String(bus.endName||'')});
          const response=await fetch(`${process.env.MAP_BASE}?${params}`,{signal:AbortSignal.timeout(45000)});
          const map=await response.json().catch(()=>({}));
          if(!response.ok) throw new Error(`Transit map HTTP ${response.status}: ${map?.error||'unknown error'}`);
          if(map?.geometry!=='daegu-official-bus-link-snapshot'||map?.geometrySnapshot!=='2025-09-03') throw new Error(`Live Transit map did not use official Daegu road geometry: ${JSON.stringify({geometry:map?.geometry,snapshot:map?.geometrySnapshot,reason:map?.geometryFallbackReason})}`);
          if(!Array.isArray(map?.route?.stops)||map.route.stops.length<2) throw new Error('Transit map route-stop geometry is incomplete');
          if(!Array.isArray(map?.route?.path)||map.route.path.length<2) throw new Error('Transit map official road path is incomplete');
          if(!Array.isArray(map?.vehicles)||!['live','unavailable'].includes(map?.vehicleStatus)) throw new Error('Transit map vehicle fallback contract is incomplete');
          console.log(`Live Transit: ${routes.length} Daegu bus route(s); outside-Daegu blocked; ${railRoutes.length} rail route(s); ${liveLegs.length} live arrival leg(s); official map ${map.route.path.length} path points / ${map.route.stops.length} stops; vehicles ${map.vehicles.length}`);
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-school-transit-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-school-transit-server.log
          exit 1
      - name: Verify School transit responsive behavior
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-transit-audit.mjs
      - name: Verify related destination suggestions across six viewports
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-transit-destination-suggestions-audit.mjs
      - name: Verify lazy bus maps across six viewports
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-transit-map-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-transit-audit
          path: |
            school-transit-audit/
            school-transit-destination-suggestions-audit/
            school-transit-map-audit/
          retention-days: 7
