name: School transit audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  school-transit-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate transit and secret sources
        run: |
          set -euo pipefail
          node --check school-transit.js
          node --check school-transit-map.js
          node --check tests/school-transit-audit.mjs
          node --check tests/school-transit-map-audit.mjs
          node scripts/edge-secret-audit.mjs
          test -s school-transit.css
          test -s school-transit-map.css
          test -s supabase/functions/transit-data/index.ts
          test -s supabase/functions/transit-map/index.ts
          test -s supabase/functions/transit-rail/index.ts
          test -s supabase/functions/university-data/bootstrap.ts
          grep -q "school-transit.js" school-metrics.js
          grep -q "school-transit-map.js" school-metrics.js
          grep -q "school-transit-map.js" sw.js
          grep -q "school-transit-map.css" sw.js
          grep -q "school-transit.css" sw.js
          grep -q "'/transit':'/index.html'" cloudflare-worker.mjs
          grep -q '"source": "/transit"' vercel.json
          grep -q "DATA_GO_KR_SERVICE_KEY" supabase/functions/transit-data/index.ts
          grep -q "KAKAO_REST_KEY" supabase/functions/transit-data/index.ts
          ! grep -q "ODSAY_API_KEY" supabase/functions/transit-data/index.ts
          grep -q "TAGO-public-data" supabase/functions/transit-data/index.ts
          grep -q "getCtyCodeList" supabase/functions/transit-data/index.ts
          grep -q "getSttnNoList" supabase/functions/transit-data/index.ts
          grep -q "city-stop-master" supabase/functions/transit-data/index.ts
          grep -q "realtimeLegs" supabase/functions/transit-data/index.ts
          grep -q "per-bus-leg-when-available" supabase/functions/transit-data/index.ts
          grep -q "coordinate-owned-source+destination" supabase/functions/transit-data/index.ts
          grep -q "node-id+walkable-stop-proximity" supabase/functions/transit-data/index.ts
          grep -q "transferWalkMeters" supabase/functions/transit-data/index.ts
          grep -q "busError" school-transit.js
          grep -q "getRouteAcctoBusLcList" supabase/functions/transit-map/index.ts
          grep -q "route-stop-sequence" supabase/functions/transit-map/index.ts
          grep -q "KAKAO_REST_KEY" supabase/functions/transit-rail/index.ts
          grep -q "KRIC-snapshot+Kakao-SW8" supabase/functions/transit-rail/index.ts
          grep -q "Daegu-1-2-3" supabase/functions/transit-rail/index.ts
          grep -q "repeat(5,minmax(0,1fr))" school-transit.css
      - name: Verify live Transit integrations, route search, rail routing, and map adapter
        shell: bash
        run: |
          set -euo pipefail
          base='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/transit-data'
          map_base='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/transit-map'
          rail_base='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/transit-rail'
          curl -fsSL --connect-timeout 10 --max-time 30 "$base?action=health" > /tmp/transit-health.json
          curl -fsSL --connect-timeout 10 --max-time 30 "$map_base?action=health" > /tmp/transit-map-health.json
          curl -fsSL --connect-timeout 10 --max-time 30 "$rail_base?action=health" > /tmp/transit-rail-health.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/transit-health.json','utf8'));
          const integrations=data?.integrations||{};
          const missing=Object.entries(integrations).filter(([,ready])=>ready!==true).map(([name])=>name);
          if(!data?.ok||missing.length) throw new Error(`Transit integrations are not ready: ${missing.join(', ')||'health failed'}`);
          if(data?.routingProvider!=='TAGO-public-data') throw new Error(`Unexpected Transit provider: ${data?.routingProvider}`);
          if(!Array.isArray(data?.stopDiscovery)||!data.stopDiscovery.includes('city-stop-master')) throw new Error('Transit city-stop fallback is not active');
          if(data?.realtimeRouting!=='per-bus-leg-when-available') throw new Error(`Transit per-leg realtime capability is not active: ${data?.realtimeRouting||'missing'}`);
          if(data?.regionalRouting!=='coordinate-owned-source+destination') throw new Error(`Transit source region isolation is not active: ${data?.regionalRouting||'missing'}`);
          if(data?.transferMatching!=='node-id+walkable-stop-proximity') throw new Error(`Transit cross-region transfer matching is not active: ${data?.transferMatching||'missing'}`);
          const map=JSON.parse(fs.readFileSync('/tmp/transit-map-health.json','utf8'));
          if(!map?.ok||map?.provider!=='TAGO-public-data'||map?.geometry!=='route-stop-sequence') throw new Error(`Transit map adapter is not ready: ${JSON.stringify(map)}`);
          const rail=JSON.parse(fs.readFileSync('/tmp/transit-rail-health.json','utf8'));
          if(!rail?.ok||rail?.provider!=='KRIC-snapshot+Kakao-SW8'||rail?.coverage!=='Daegu-1-2-3'||rail?.snapshotDate!=='2026-06-30'||rail?.realtime!==false||rail?.waitModel!=='estimated') throw new Error(`Transit rail adapter is not ready: ${JSON.stringify(rail)}`);
          console.log('Transit integrations: regional bus routing + walkable transfers + per-leg realtime + Daegu rail + lazy bus map ready');
          NODE
          route_status=$(curl -sSL -o /tmp/transit-route.json -w '%{http_code}' --get --connect-timeout 10 --max-time 80 \
            --data-urlencode 'action=route' \
            --data-urlencode 'sx=128.6014' \
            --data-urlencode 'sy=35.8714' \
            --data-urlencode 'destination=대구광역시 북구 대학로 80' \
            "$base")
          if [ "$route_status" != "200" ]; then
            echo "Transit route HTTP $route_status"
            cat /tmp/transit-route.json
            echo
            exit 1
          fi
          cross_status=$(curl -sSL -o /tmp/transit-cross-region.json -w '%{http_code}' --get --connect-timeout 10 --max-time 120 \
            --data-urlencode 'action=route' \
            --data-urlencode 'sx=128.485925' \
            --data-urlencode 'sy=35.955765' \
            --data-urlencode 'destination=대구광역시 동구 용계로1길 49' \
            "$base")
          if [ "$cross_status" != "200" ]; then
            echo "Cross-region Transit HTTP $cross_status"
            cat /tmp/transit-cross-region.json
            echo
            exit 1
          fi
          rail_status=$(curl -sSL -o /tmp/transit-rail-route.json -w '%{http_code}' --get --connect-timeout 10 --max-time 35 \
            --data-urlencode 'action=route' \
            --data-urlencode 'sx=128.5935' \
            --data-urlencode 'sy=35.8656' \
            --data-urlencode 'ex=128.6272' \
            --data-urlencode 'ey=35.8796' \
            "$rail_base")
          if [ "$rail_status" != "200" ]; then
            echo "Transit rail HTTP $rail_status"
            cat /tmp/transit-rail-route.json
            echo
            exit 1
          fi
          MAP_BASE="$map_base" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/transit-route.json','utf8'));
          const routes=Array.isArray(data?.routes)?data.routes:[];
          if(routes.length<1||routes.length>5) throw new Error(`Expected 1-5 live routes, got ${routes.length}: ${data?.error||'unknown response'}`);
          if(data?.provider!=='TAGO-public-data') throw new Error(`Unexpected route provider: ${data?.provider}`);
          if(!routes.every(route=>Number(route.totalMinutes)>0&&Array.isArray(route.segments)&&route.segments.length)) throw new Error('Live route normalization is incomplete');
          if(!routes.every(route=>Array.isArray(route.realtimeLegs))) throw new Error('Per-leg realtime shape is missing from live routes');
          const cross=JSON.parse(fs.readFileSync('/tmp/transit-cross-region.json','utf8'));
          const crossRoutes=Array.isArray(cross?.routes)?cross.routes:[];
          if(crossRoutes.length<1||crossRoutes.length>5) throw new Error(`Expected cross-region route(s), got ${crossRoutes.length}: ${cross?.error||'unknown response'}`);
          const crossTransfer=crossRoutes.find(route=>Number(route.transfers)>=1&&(route.segments||[]).filter(segment=>segment.type==='bus').length>=2);
          if(!crossTransfer) throw new Error(`Cross-region route must contain a real bus transfer: ${JSON.stringify(crossRoutes)}`);
          const crossLines=(crossTransfer.segments||[]).filter(segment=>segment.type==='bus').flatMap(segment=>segment.lines||[]).map(String);
          if(!crossLines.some(line=>line.includes('250'))||!crossLines.some(line=>line.includes('708'))) throw new Error(`Expected public 250→708 cross-region connection, got ${crossLines.join(' → ')}`);
          const rail=JSON.parse(fs.readFileSync('/tmp/transit-rail-route.json','utf8'));
          const railRoutes=Array.isArray(rail?.routes)?rail.routes:[];
          if(railRoutes.length<1||railRoutes.length>5) throw new Error(`Expected 1-5 live Daegu rail routes, got ${railRoutes.length}: ${rail?.error||'unknown response'}`);
          if(rail?.provider!=='KRIC-snapshot+Kakao-SW8'||rail?.waitModel!=='estimated') throw new Error(`Unexpected rail contract: ${JSON.stringify(rail)}`);
          if(!railRoutes.every(route=>Number(route.totalMinutes)>0&&(route.segments||[]).some(segment=>segment.type==='subway'))) throw new Error('Live rail normalization is incomplete');
          const bus=routes.flatMap(route=>route.segments||[]).find(segment=>segment.type==='bus'&&segment.startId&&segment.endId&&segment.lines?.[0]);
          if(!bus) throw new Error('No live bus segment available for map adapter validation');
          const params=new URLSearchParams({action:'route-map',region:'대구광역시',line:String(bus.lines[0]),startId:String(bus.startId),endId:String(bus.endId),startName:String(bus.startName||''),endName:String(bus.endName||'')});
          const response=await fetch(`${process.env.MAP_BASE}?${params}`,{signal:AbortSignal.timeout(45000)});
          const map=await response.json().catch(()=>({}));
          if(!response.ok) throw new Error(`Transit map HTTP ${response.status}: ${map?.error||'unknown error'}`);
          if(!Array.isArray(map?.route?.stops)||map.route.stops.length<2) throw new Error('Transit map route-stop geometry is incomplete');
          if(!Array.isArray(map?.vehicles)||!['live','unavailable'].includes(map?.vehicleStatus)) throw new Error('Transit map vehicle fallback contract is incomplete');
          console.log(`Live Transit: ${routes.length} local bus route(s); ${crossRoutes.length} cross-region route(s); ${railRoutes.length} rail route(s); map ${map.route.stops.length} stops; vehicles ${map.vehicles.length}`);
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-school-transit-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-school-transit-server.log
          exit 1
      - name: Verify School transit responsive behavior
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-transit-audit.mjs
      - name: Verify lazy bus maps across six viewports
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-transit-map-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-transit-audit
          path: |
            school-transit-audit/
            school-transit-map-audit/
          retention-days: 7
