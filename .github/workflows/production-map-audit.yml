name: Production campus map audit

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker.mjs'
      - 'university/**'
      - 'scripts/production-map-audit.mjs'
      - '.github/workflows/production-map-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare-worker.mjs'
      - 'university/university.js'
      - 'university/campus.js'
      - 'university/campus-interactive.js'
      - 'university/campus-interactive.css'
      - 'university/poi-icons.js'
      - 'scripts/production-map-audit.mjs'
      - '.github/workflows/production-map-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  production-campus-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate campus audit sources
        run: |
          set -euo pipefail
          node --input-type=module --check < university/campus.js
          node --input-type=module --check < university/campus-interactive.js
          node --check scripts/production-map-audit.mjs
          grep -q 'flow:campus-current-route' university/campus.js
          grep -q 'flow:campus-current-route' university/campus-interactive.js
          grep -q "location.pathname==='/university/campus'" university/campus.js
          grep -q "redirect:'follow'" cloudflare-worker.mjs
          grep -q 'currentRouteRequestDelta' scripts/production-map-audit.mjs
          grep -q "id:'0000005'" scripts/production-map-audit.mjs
          grep -q "address:'대구광역시 북구 대학로 80'" scripts/production-map-audit.mjs
          grep -q "source:'deterministic-production-profile'" scripts/production-map-audit.mjs
          ! grep -q 'university-data' scripts/production-map-audit.mjs
      - name: Wait for production assets
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          base='https://blank-app.agfvrd.workers.dev'
          assets=(
            'university/university.js'
            'university/campus.js'
            'university/campus-interactive.js'
            'university/poi-icons.js'
          )
          for i in {1..40}; do
            echo "University production convergence attempt $i/40"
            ok=1
            page='/tmp/flow-production-campus.html'
            requested="$base/university/campus?flow_deploy=$GITHUB_SHA"
            result=$(curl --silent --show-error --location \
              --header 'cache-control: no-cache' \
              --connect-timeout 10 --max-time 20 \
              --output "$page" --write-out '%{http_code}|%{url_effective}' \
              "$requested" || true)
            code="${result%%|*}"
            effective="${result#*|}"
            if [[ "$code" != '200' ]] || [[ "$effective" != "$requested" ]] || ! grep -q 'campus-interactive.js' "$page" 2>/dev/null; then
              echo "WAIT /university/campus -> HTTP $code / effective $effective / expected clean URL $requested"
              ok=0
            else
              echo 'OK /university/campus -> 200 without a browser-visible canonicalization redirect'
            fi

            if [[ "$ok" == '1' ]]; then
              for asset in "${assets[@]}"; do
                deployed="/tmp/flow-${asset//\//_}"
                code=$(curl --silent --show-error --location \
                  --header 'cache-control: no-cache' \
                  --connect-timeout 10 --max-time 20 \
                  --output "$deployed" --write-out '%{http_code}' \
                  "$base/$asset?flow_deploy=$GITHUB_SHA" || true)
                if [[ "$code" != '200' ]] || ! cmp -s "$asset" "$deployed"; then
                  echo "WAIT /$asset -> HTTP $code / deployed bytes do not match main"
                  ok=0
                  break
                fi
                echo "OK /$asset -> exact repository bytes"
              done
            fi

            if [[ "$ok" == '1' ]]; then
              echo 'University production assets and clean Campus URL match the audited commit.'
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for exact University production assets and clean Campus route.' >&2
          exit 1
      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request'
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
      - name: Audit production interactive map
        if: github.event_name != 'pull_request'
        env:
          FLOW_PRODUCTION_URL: https://blank-app.agfvrd.workers.dev
        run: node scripts/production-map-audit.mjs
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name != 'pull_request'
        with:
          name: production-campus-map-audit
          path: production-map-audit/
          retention-days: 5
      - name: Log successful production map audit
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=$(jq -c . production-map-audit/report.json)
          short=${GITHUB_SHA:0:7}
          body=$(printf '### Production campus map audit — %s\n\nPASS: Kakao Web Map SDK rendered on the registered production domain, including current-position route reuse.\n\n```json\n%s\n```' "$short" "$report")
          gh issue comment 14 --body "$body"
      - name: Log failed production map audit
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${GITHUB_SHA:0:7}
          body=$(printf '### Production campus map audit — %s\n\nFAIL: production interactive map browser audit failed.\n\nRun: https://github.com/%s/actions/runs/%s' "$short" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh issue comment 14 --body "$body"
