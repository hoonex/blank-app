name: Production campus map audit

on:
  push:
    branches: [main]
    paths:
      - 'university/**'
      - 'scripts/production-map-audit.mjs'
      - '.github/workflows/production-map-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'university/campus.js'
      - 'university/campus-interactive.js'
      - 'university/campus-interactive.css'
      - 'scripts/production-map-audit.mjs'
      - '.github/workflows/production-map-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  production-campus-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate campus audit sources
        run: |
          set -euo pipefail
          node --input-type=module --check < university/campus.js
          node --input-type=module --check < university/campus-interactive.js
          node --check scripts/production-map-audit.mjs
          grep -q 'flow:campus-current-route' university/campus.js
          grep -q 'flow:campus-current-route' university/campus-interactive.js
          grep -q 'currentRouteRequestDelta' scripts/production-map-audit.mjs
      - name: Wait for production assets
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          url='https://flow-student-blush.vercel.app/university/campus'
          for i in {1..60}; do
            if curl -fsSL --max-time 10 "$url" | grep -q 'campus-interactive.js'; then
              echo 'Interactive campus asset is live.'
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for production interactive campus asset.' >&2
          exit 1
      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Audit production interactive map
        if: github.event_name != 'pull_request'
        env:
          FLOW_PRODUCTION_URL: https://flow-student-blush.vercel.app
        run: node scripts/production-map-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: production-campus-map-audit
          path: production-map-audit/
          retention-days: 5
      - name: Log successful production map audit
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=$(jq -c . production-map-audit/report.json)
          short=${GITHUB_SHA:0:7}
          gh issue comment 14 --body "### Production campus map audit — ${short}

PASS: Kakao Web Map SDK rendered on the registered production domain, including current-position route reuse.

\`\`\`json
${report}
\`\`\`"
      - name: Log failed production map audit
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=${GITHUB_SHA:0:7}
          gh issue comment 14 --body "### Production campus map audit — ${short}

FAIL: production interactive map browser audit failed.

Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
