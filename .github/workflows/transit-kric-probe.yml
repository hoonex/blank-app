name: Transit KRIC compatibility probe
on:
  push:
    branches: [feat/transit-rail-adapter-20260828]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe server-side KRIC compatibility
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 25 \
            'https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/transit-kric-probe' \
            -o /tmp/kric.json
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/kric.json','utf8'));
          console.log(JSON.stringify(data));
          NODE
