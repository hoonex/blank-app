name: Dashboard editor v2 audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  widget-editor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate widget editor source
        run: |
          node --check university/dashboard-editor-v2.js
          node --check scripts/dashboard-editor-v2-audit.mjs
          test -f university/dashboard-editor-v2.css
          grep -q "dashboard-editor-v2.js" university/poi-icons.js
          grep -q "dashboard-editor-v2.js" sw.js
          grep -q "dashboard-editor-v2.css" sw.js
          grep -q "widget-memo-input" university/dashboard-editor-v2.js
          grep -q "data-dashboard-columns" university/dashboard-editor-v2.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-widget-v2-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/university/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-widget-v2-server.log
          exit 1
      - name: Run widget editor browser audit
        run: node scripts/dashboard-editor-v2-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-editor-v2-audit
          path: university-audit/
          retention-days: 5
