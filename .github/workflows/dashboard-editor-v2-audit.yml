name: Dashboard editor v2 audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  widget-editor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate widget editor source
        run: |
          node --check university/dashboard.js
          node --check university/dashboard-editor-v2.js
          node --check university/dashboard-editor-feedback.js
          node --check university/dashboard-home-editing.js
          node --check university/dashboard-memo-panel.js
          node --check university/ui-unify.js
          node --check scripts/dashboard-editor-v2-audit.mjs
          node --check scripts/widget-settle-interruption-audit.mjs
          node --check scripts/dashboard-default-composition-audit.mjs
          node --check scripts/widget-home-editing-audit.mjs
          node --check scripts/widget-gallery-composition-audit.mjs
          node --check scripts/widget-picker-touch-audit.mjs
          node --check scripts/widget-variant-audit.mjs
          node --check scripts/memo-panel-audit.mjs
          node --check scripts/mobile-stability-audit.mjs
          test -f university/dashboard-editor-v2.css
          test -f university/dashboard-home-editing.css
          test -f university/dashboard-variants.css
          test -f university/dashboard-memo-panel.css
          test -f university/ui-unify-v2.css
          test -f university/campus-ui-polish.css
          grep -q "dashboard-editor-v2.js" university/poi-icons.js
          grep -q "dashboard-editor-v2.js" sw.js
          grep -q "dashboard-editor-v2.css" sw.js
          grep -q "dashboard-home-editing.js" university/dashboard-editor-feedback.js
          grep -q "dashboard-home-editing.js" sw.js
          grep -q "dashboard-home-editing.css" sw.js
          grep -q "dashboard-variants.css" sw.js
          grep -q "dashboard-memo-panel.js" university/dashboard-editor-feedback.js
          grep -q "dashboard-memo-panel.js" sw.js
          grep -q "dashboard-memo-panel.css" sw.js
          grep -q "ui-unify-v2.css" university/ui-unify.js
          grep -q "ui-unify-v2.css" sw.js
          grep -q "campus-ui-polish.css" university/ui-unify.js
          grep -q "campus-ui-polish.css" sw.js
          grep -q "widget-memo-input" university/dashboard-editor-v2.js
          grep -q "data-dashboard-columns" university/dashboard-editor-v2.js
          grep -q "widget-direct-floating" university/dashboard-editor-v2.js
          grep -q "settleAnimations" university/dashboard-editor-v2.js
          grep -q "presentationRect" university/dashboard-editor-v2.js
          grep -q "widget-drag-placeholder" university/dashboard-editor-v2.css
          grep -q "DWELL_MS=190" university/dashboard-home-editing.js
          grep -q "touch-action:pan-y" university/dashboard-home-editing.css
          grep -q "pickerTouchStart" university/dashboard-home-editing.js
          grep -q "data-widget-auto-scroll" university/dashboard-home-editing.js
          grep -q "widget-picker-live-preview" university/dashboard-home-editing.js
          grep -q "widget-picker-live-preview.next-card" university/dashboard-home-editing.css
          grep -q "grid-auto-flow:row" university/ui-unify-v2.css
          grep -q "repeat(4,minmax(0,1fr))" university/ui-unify-v2.css
          grep -q "clock:{label:'현재 시각'" university/dashboard.js
          grep -q "shortcuts:{label:'바로가기'" university/dashboard.js
          grep -q "dayflow:{label:'오늘 흐름'" university/dashboard.js
          grep -q "weekload:{label:'주간 밀도'" university/dashboard.js
          grep -q "flow-school-brand-critical" index.html
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-widget-v2-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/university/ >/dev/null && exit 0; sleep .3; done
          cat /tmp/flow-widget-v2-server.log
          exit 1
      - name: Run widget editor browser audit
        run: node scripts/dashboard-editor-v2-audit.mjs
      - name: Verify widget settle interruption continuity
        run: node scripts/widget-settle-interruption-audit.mjs
      - name: Verify fresh dashboard composition and saved-layout preservation
        run: node scripts/dashboard-default-composition-audit.mjs
      - name: Run touch home editing and Campus composition audit
        run: node scripts/widget-home-editing-audit.mjs
      - name: Verify widget gallery composition across six viewports
        run: node scripts/widget-gallery-composition-audit.mjs
      - name: Run continuous touch drag from widget gallery audit
        run: node scripts/widget-picker-touch-audit.mjs
      - name: Run semantic widget variant audit
        run: node scripts/widget-variant-audit.mjs
      - name: Run memo and visual unification audit
        run: node scripts/memo-panel-audit.mjs
      - name: Run mobile nav and widget stability audit
        run: node scripts/mobile-stability-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-editor-v2-audit
          path: university-audit/
          retention-days: 5