name: School real-device mobile audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'school-real-device-hotfix.js'
      - 'school-real-device-refine.js'
      - 'school-final-visual-polish.js'
      - 'school-toolbar-grouping.js'
      - 'school-metrics.js'
      - 'school-ia.js'
      - 'school-today-responsive.css'
      - 'flow-adfit.js'
      - 'flow-adfit.css'
      - 'tests/school-real-device-mobile-audit.mjs'
      - 'tests/school-phone-radius-audit.mjs'
      - 'tests/school-final-visual-audit.mjs'
      - 'tests/school-toolbar-grouping-audit.mjs'
      - '.github/workflows/school-real-device-mobile-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-device-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate real-device sources
        run: |
          node --check school-real-device-hotfix.js
          node --check school-real-device-refine.js
          node --check school-final-visual-polish.js
          node --check school-toolbar-grouping.js
          node --check tests/school-real-device-mobile-audit.mjs
          node --check tests/school-phone-radius-audit.mjs
          node --check tests/school-final-visual-audit.mjs
          node --check tests/school-toolbar-grouping-audit.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/flow-real-device-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep .3
          done
          cat /tmp/flow-real-device-server.log
          exit 1
      - name: Verify phone Week, density, nav, and iframe ad composition
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
          FLOW_TEST_OUT: school-real-device-mobile-audit
        run: node tests/school-real-device-mobile-audit.mjs
      - name: Verify circular rounded-rectangle curvature
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/school-phone-radius-audit.mjs
      - name: Verify time ambience and final timetable composition
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
          FLOW_TEST_OUT: school-final-visual-audit
        run: node tests/school-final-visual-audit.mjs
      - name: Verify toolbar grouping and connected Week navigation
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
          FLOW_TEST_OUT: school-toolbar-grouping-audit
        run: node tests/school-toolbar-grouping-audit.mjs
      - name: Upload real-device screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-real-device-mobile-audit
          path: |
            school-real-device-mobile-audit
            school-final-visual-audit
            school-toolbar-grouping-audit
          if-no-files-found: ignore