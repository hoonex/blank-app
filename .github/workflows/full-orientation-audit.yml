name: Full orientation functional audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-orientation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audit source
        run: |
          node --check flow-native.js
          node --check flow-refraction.js
          node --check scripts/full-orientation-audit.mjs
          node --check tests/native-feel-audit.mjs
          node --check tests/liquid-glass-tab-lens-audit.mjs
          node --check tests/apple-material-audit.mjs
          node --check tests/native-sheet-drag-audit.mjs
          node --check tests/optical-glass-settings-audit.mjs
          node --check tests/optical-refraction-visual-audit.mjs
          node --check tests/settings-navigation-visual-audit.mjs
          test -f flow-material.css
          test -f flow-refraction.css
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-orientation-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep .3
          done
          cat /tmp/flow-orientation-server.log
          exit 1
      - name: Verify semantic shapes and standard glass default
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/apple-material-audit.mjs
      - name: Verify unified settings and opt-in optical refraction
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/optical-glass-settings-audit.mjs
      - name: Prove rendered Optical Glass edge displacement
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/optical-refraction-visual-audit.mjs
      - name: Verify transient sheet direct drag and dismiss
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/native-sheet-drag-audit.mjs
      - name: Verify Liquid Glass lens tap, hold, drag, momentum, and overflow
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/liquid-glass-tab-lens-audit.mjs
      - name: Exercise School, University, Campus, widgets, and Admin in six viewports
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node scripts/full-orientation-audit.mjs
      - name: Verify Settings first-fold and destination feedback
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/settings-navigation-visual-audit.mjs
      - name: Verify native-feel motion and reduced-motion behavior
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node tests/native-feel-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-orientation-audit
          path: |
            full-orientation-audit/
            native-feel-audit/
            settings-navigation-visual-audit/
            optical-refraction-audit/
          retention-days: 7
