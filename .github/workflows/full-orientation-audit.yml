name: Full orientation functional audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-orientation-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audit source
        run: node --check scripts/full-orientation-audit.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Start local Flow server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/flow-orientation-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep .3
          done
          cat /tmp/flow-orientation-server.log
          exit 1
      - name: Exercise School, University, Campus, widgets, and Admin in six viewports
        env:
          FLOW_BASE_URL: http://127.0.0.1:4173
        run: node scripts/full-orientation-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-orientation-audit
          path: full-orientation-audit/
          retention-days: 7
