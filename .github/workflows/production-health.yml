name: Production health check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose public production MIME types
        shell: bash
        run: |
          set -euo pipefail
          base="https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/flow-site/"
          for path in "" "focus.html" "study-calculator.html" "styles.css" "app.js"; do
            file="/tmp/$(echo "$path" | tr '/.' '__').out"
            headers="${file}.headers"
            code=$(curl --silent --show-error --location -D "$headers" -o "$file" -w '%{http_code}' "${base}${path}")
            echo "---- ${path:-/} HTTP=$code ----"
            grep -iE '^(content-type|content-disposition|x-content-type-options|location):' "$headers" || true
            echo "FIRST_BYTES=$(head -c 80 "$file" | tr '\n' ' ')"
          done

      - name: Assert rendered MIME types
        shell: bash
        run: |
          set -euo pipefail
          base="https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/flow-site/"
          mime=$(curl --silent --show-error --location -o /tmp/home.html -w '%{content_type}' "$base")
          echo "HOME_CONTENT_TYPE=$mime"
          test "$mime" = "text/html; charset=utf-8"
          grep -qi 'Flow Calendar' /tmp/home.html
