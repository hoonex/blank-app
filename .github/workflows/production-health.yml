name: Production health check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Verify Flow School files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html school.css school.js scripts/vercel-rest.mjs; do
            test -s "$file"
            echo "OK $file"
          done
          node --input-type=module --check < school.js
          node --check scripts/vercel-rest.mjs
          grep -q 'Flow School' index.html
          grep -q 'school.css' index.html
          grep -q 'school.js' index.html
          grep -q 'flow-school-profile-v2' school.js
          grep -q 'functions/v1/school-data' school.js
          grep -q 'ssoProtection: null' scripts/vercel-rest.mjs

      - name: Verify NEIS proxy search
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          url='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/school-data?action=search&q=%EC%A0%95%EB%8F%99%EA%B3%A0'
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 25 "$url" > /tmp/school.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/school.json'))
          schools=data.get('schools') or []
          assert schools, data
          assert any('정동' in (x.get('name') or '') for x in schools), schools
          print('NEIS proxy OK:', schools[0].get('name'))
          PY
