name: Production health check

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production home
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 25 \
            -o /tmp/home.html \
            https://flow-focus-agfvrd-5616s-projects.vercel.app/
          test -s /tmp/home.html
          grep -qiE 'Flow|Calendar|Focus' /tmp/home.html

      - name: Check Flow Focus
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 25 \
            -o /tmp/focus.html \
            https://flow-focus-agfvrd-5616s-projects.vercel.app/focus.html
          test -s /tmp/focus.html
          grep -qi 'Flow Focus' /tmp/focus.html

      - name: Check study calculator
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 --connect-timeout 10 --max-time 25 \
            -o /tmp/calculator.html \
            https://flow-focus-agfvrd-5616s-projects.vercel.app/study-calculator.html
          test -s /tmp/calculator.html
          grep -qi '시험 공부시간 계산기' /tmp/calculator.html
