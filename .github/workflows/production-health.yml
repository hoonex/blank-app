name: Production health check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Verify Flow School files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html school.css school.js school-extras.js sw.js manifest.webmanifest robots.txt sitemap.xml scripts/vercel-rest.mjs; do
            test -s "$file"
            echo "OK $file"
          done
          node --input-type=module --check < school.js
          node --input-type=module --check < school-extras.js
          node --check sw.js
          node --check scripts/vercel-rest.mjs
          grep -q 'Flow School' index.html
          grep -q 'school.css' index.html
          grep -q 'school.js' index.html
          grep -q 'school-extras.js' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'flow-school-profile-v2' school.js
          grep -q 'functions/v1/school-data' school.js
          grep -q 'flow-student-blush.vercel.app' robots.txt
          grep -q 'flow-student-blush.vercel.app' sitemap.xml
          grep -q 'ssoProtection: null' scripts/vercel-rest.mjs

      - name: Verify NEIS school API
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/school-data'
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 25 \
            "$base?action=search&q=%EC%A0%95%EB%8F%99%EA%B3%A0" > /tmp/search.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/search.json'))
          schools=data.get('schools') or []
          assert schools, data
          assert any('정동' in (x.get('name') or '') for x in schools), schools
          print('school search OK')
          PY
          today=$(date +%Y%m%d)
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 25 \
            "$base?action=dashboard&office=D10&school=7240101&grade=1&class=1&kind=%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&date=$today" > /tmp/dashboard.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/dashboard.json'))
          for key in ('timetable','meals','events'):
            assert key in data, data
            assert isinstance(data[key], list), (key, data[key])
          print('dashboard API OK')
          PY
