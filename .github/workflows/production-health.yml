name: Production health check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose production routes
        shell: bash
        run: |
          set -u
          failed=0
          check() {
            path="$1"
            expected="$2"
            file="/tmp/$(echo "$path" | tr '/.' '__').html"
            code=$(curl --silent --show-error --location \
              --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 25 \
              -o "$file" -w '%{http_code}' \
              "https://flow-focus-agfvrd-5616s-projects.vercel.app${path}" || echo curl_error)
            echo "PATH=$path HTTP=$code BYTES=$(wc -c < "$file" 2>/dev/null || echo 0)"
            title=$(grep -oim1 '<title>[^<]*</title>' "$file" 2>/dev/null || true)
            echo "TITLE=${title:-none}"
            if [ "$code" != "200" ] || ! grep -qi "$expected" "$file" 2>/dev/null; then
              echo "VERIFY=FAIL expected=$expected"
              failed=1
            else
              echo "VERIFY=PASS expected=$expected"
            fi
          }
          check "/" "Flow"
          check "/focus.html" "Flow Focus"
          check "/study-calculator.html" "시험 공부시간 계산기"
          exit "$failed"
