name: Production health check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Verify Flow School runtime
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html school.css school.js school-metrics.js school-v5.css school-hotfix.css school-polish.css sw.js manifest.webmanifest robots.txt sitemap.xml vercel.json scripts/vercel-rest.mjs university/index.html university/university.css university/university-polish.css university/university.js university/dashboard.css university/dashboard.js university/dashboard-memo-panel.css university/dashboard-memo-panel.js university/ui-unify.css university/ui-unify-v2.css university/ui-unify.js university/poi-icons.js university/campus.css university/campus.js university/campus-interactive.css university/campus-interactive.js; do
            test -s "$file"
            echo "OK $file"
          done
          node --input-type=module --check < school.js
          node --check school-metrics.js
          node --check sw.js
          node --check university/university.js
          node --check university/dashboard.js
          node --check university/dashboard-memo-panel.js
          node --check university/ui-unify.js
          node --input-type=module --check < university/poi-icons.js
          node --input-type=module --check < university/campus.js
          node --input-type=module --check < university/campus-interactive.js
          node --check scripts/vercel-rest.mjs
          python -m json.tool vercel.json >/dev/null
          grep -q 'Flow School' index.html
          grep -q 'school-metrics.js' index.html
          grep -q 'flow-school-profile-v3' school.js
          grep -q 'NATIONAL_2026' school.js
          grep -q "'/schedule':'schedule'" school.js
          grep -q 'renderActiveView' school.js
          grep -q 'memoryCache' school.js
          grep -q 'school-polish.css' school-metrics.js
          grep -q 'recoverSchoolLogo' school-metrics.js
          grep -q 'functions/v1/school-logo' school-metrics.js
          ! grep -q 'icons.duckduckgo.com' school-metrics.js
          ! grep -q "import('./school-v5.js')" school-metrics.js
          ! grep -q 'MutationObserver' school.js
          ! grep -q 'MutationObserver' school-metrics.js
          ! grep -q 'scrollTo' school.js
          grep -q 'corner-shape:squircle' school-v5.css
          grep -q 'body.dialog-open' school-hotfix.css
          grep -q 'week-cell' school-polish.css
          grep -q 'only light' school-polish.css
          grep -q 'flow-school-shell-v11' sw.js
          grep -q '/university/poi-icons.js' sw.js
          grep -q '/university/index.html' sw.js
          grep -q '/university/dashboard-memo-panel.js' sw.js
          grep -q '/university/ui-unify-v2.css' sw.js
          grep -q 'Flow University' university/index.html
          grep -q 'university-polish.css' university/index.html
          grep -q 'only light' university/university-polish.css
          grep -q 'flow-university-profile-v1' university/university.js
          grep -q 'import-everytime' university/university.js
          grep -q 'flow-university-memo-v1' university/dashboard-memo-panel.js
          grep -q '#5577e9' university/ui-unify-v2.css
          grep -q 'poiBadgeMarkup' university/campus.js
          grep -q 'decoratePoiNode' university/campus-interactive.js
          grep -q 'brand-gs25' university/campus.css
          grep -q 'brand-emart24' university/campus-interactive.css
          grep -q '"/home"' vercel.json
          grep -q '"/schedule"' vercel.json
          grep -q '"/university/timetable"' vercel.json
          grep -q 'UNIVERSITY_CLEAN_ROUTES' scripts/vercel-rest.mjs
          grep -q 'flow-student-blush.vercel.app' robots.txt
          grep -q 'flow-student-blush.vercel.app' sitemap.xml
          grep -q 'ssoProtection: null' scripts/vercel-rest.mjs
          ! test -e school-extras.js

      - name: Verify NEIS school API
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/school-data'
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 25 \
            "$base?action=search&q=%EC%A0%95%EB%8F%99%EA%B3%A0" > /tmp/search.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/search.json'))
          schools=data.get('schools') or []
          assert schools, data
          school=next((x for x in schools if '정동' in (x.get('name') or '')), None)
          assert school, schools
          for key in ('officeCode','schoolCode','name','kind'):
            assert school.get(key), (key, school)
          print('school search OK:', school['name'])
          PY

          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 25 \
            "$base?action=classes&office=D10&school=7240101&grade=2" > /tmp/classes.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/classes.json'))
          assert 'classes' in data and isinstance(data['classes'], list), data
          print('class API OK:', len(data['classes']))
          PY

          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 25 \
            "$base?action=search&q=%EB%8C%80%EA%B5%AC%EB%8F%99%EB%B6%80%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90" > /tmp/dongbu-search.json
          python - <<'PY' > /tmp/dongbu.env
          import json
          data=json.load(open('/tmp/dongbu-search.json'))
          school=next((x for x in data.get('schools',[]) if x.get('name')=='대구동부고등학교'), None)
          assert school, data
          print('OFFICE='+school['officeCode'])
          print('SCHOOL='+school['schoolCode'])
          PY
          source /tmp/dongbu.env
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 25 \
            "$base?action=dashboard&office=$OFFICE&school=$SCHOOL&grade=2&class=1&kind=%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&date=20260715" > /tmp/dongbu-dashboard.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/dongbu-dashboard.json'))
          events=data.get('events') or []
          assert events, data
          assert any('방학' in (e.get('name') or '') or '시험' in (e.get('name') or '') for e in events), events
          assert 'scheduleMeta' in data, data
          print('Dongbu schedule OK:', len(events), data['scheduleMeta'])
          PY

          today=$(date +%Y%m%d)
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 25 \
            "$base?action=dashboard&office=D10&school=7240101&grade=2&class=6&kind=%EA%B3%A0%EB%93%B1%ED%95%99%EA%B5%90&date=$today" > /tmp/dashboard.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/dashboard.json'))
          for key in ('timetable','meals','events'):
            assert key in data and isinstance(data[key], list), (key, data.get(key))
          school=data.get('school') or {}
          for key in ('name','officeName','address','homepage'):
            assert key in school, (key, school)
          print('dashboard API OK:', school.get('name'))
          PY

      - name: Verify university API
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='https://eicwcohfrvhwimwevzkd.supabase.co/functions/v1/university-data'
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 25 \
            "$base?action=search&q=%EA%B2%BD%EB%B6%81%EB%8C%80%ED%95%99%EA%B5%90&v=6" > /tmp/university.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/university.json'))
          schools=data.get('schools') or []
          assert schools and schools[0].get('name')=='경북대학교', data
          assert all(x.get('division')=='대학' for x in schools), schools
          print('university search OK:', len(schools))
          PY
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 25 \
            -X POST -H 'content-type: application/json' \
            -d '{"url":"https://everytime.kr/@de9YHaTAnl47JtxH0muz"}' \
            "$base?action=import-everytime" > /tmp/everytime.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/everytime.json'))
          tt=data.get('timetable') or {}
          subjects=tt.get('subjects') or []
          assert subjects and any((s.get('times') or []) for s in subjects), data
          print('Everytime import OK:', len(subjects))
          PY
